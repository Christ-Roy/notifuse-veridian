# Gitleaks config Veridian — étend le ruleset par défaut (extend, pas override).
#
# Constitution CI §13 : pas d'exception de scan secret sans justification (VEX)
# écrite. Toutes les exceptions ci-dessous sont des FAUX POSITIFS pré-existants
# dans le code UPSTREAM Notifuse (auteur @notifuse.com / Pierre Bazoge), jamais
# introduits par Veridian. Aucun secret réel.
#
# Contexte du fix (2026-05-30) : le job gitleaks (exit-code 2) bloquait `build`
# (needs) donc `deploy-prod`. La prod Notifuse était GELÉE — aucun deploy
# possible. Cf. run 26690180913. 174 findings, tous faux positifs.

[extend]
useDefault = true

[allowlist]
description = """
VEX 2026-05-30 — Faux positifs gitleaks, tous upstream Notifuse, aucun secret réel.

Catégories allowlistées (par regex de chemin) :

1. pkg/disposable_emails/disposable_emails.go — liste de ~122 000 domaines
   d'emails jetables. Domaines aléatoires (ex 'kapidanjskt82215.ml') matchent
   la règle generic-api-key par entropie. Ce sont des noms de domaines publics.

2. Fichiers de TEST / FIXTURES (*_test.go, testdata/, certs/, certificates/,
   *.pem) — fausses clés et certificats localhost pour les tests unitaires.
   Inclut test_key.pem, localhost-key.pem (certs test), stripe sk_test_ de
   fixtures (message_history_handler_test.go).

3. Fichiers d'EXEMPLE / DEMO (*.env.example, *.env.test, test_keys.go,
   testkeys/keys.go, demo_service.go) — placeholders documentés upstream.

4. DOCS et SPECS (*.md, openapi.json, openapi/**, *.astro, ApiCommandModal.tsx,
   TransactionalNotificationsPage.tsx, workflows .github/**) — exemples de
   tokens dans la doc API / curl, pas des credentials.

Le code APPLICATIF réel (internal/**, pkg/** hors disposable_emails, config/**
hors *_test) reste SCANNÉ normalement. Si un vrai secret y est commité, gitleaks
bloque toujours.
"""
paths = [
  '''pkg/disposable_emails/disposable_emails\.go''',
  '''.*_test\.go$''',
  '''.*/testdata/.*''',
  '''.*/(certs|certificates)/.*''',
  '''.*\.pem$''',
  '''.*\.env\.(example|test)$''',
  '''cmd/api/test_keys\.go''',
  '''pkg/testkeys/keys\.go''',
  '''internal/service/demo_service\.go''',
  '''.*\.md$''',
  '''openapi\.json$''',
  '''openapi/.*''',
  '''.*\.astro$''',
  '''console/src/components/transactional/ApiCommandModal\.tsx''',
  '''console/src/pages/TransactionalNotificationsPage\.tsx''',
  '''\.github/workflows/.*''',
  '''Makefile\.integration''',
]
