# ============================================================================
# IAC — Workspace cold "coldtunnel" (prod Notifuse)
# ============================================================================
# Manifeste DÉCLARATIF idempotent de la config cold outreach.
# But (Robert 2026-06-15) : "tout poser comme IAC idempotent pour avoir d'un
# coup d'œil notre contenu et l'éditer facilement depuis des fichiers".
#
# Appliqué par : scripts/iac/notifuse-iac.sh (Lot IAC #18) — plan/apply
# idempotent contre l'API Notifuse (POST /api/<resource>.<verb>, auth owner).
# Les SECRETS ne sont JAMAIS en clair ici : référencés par ${VAR} depuis
# ~/credentials/.all-creds.env, injectés à l'apply (fichier temp 0600).
#
#   scripts/iac/notifuse-iac.sh plan  --env staging   # diff read-only
#   scripts/iac/notifuse-iac.sh apply --env staging   # converge (idempotent)
#   scripts/iac/notifuse-iac.sh apply --env prod --yes # prod = opt-in explicite
#
# ✅ STATUT 2026-06-15 : APPLIQUÉ + idempotence vérifiée sur STAGING
# (notifuse.staging.veridian.site) — SMTP relay agences-veridian.fr (3 senders,
# rates/caps/tracking par classe), IMAP retour Lark, settings cold workspace.
# Re-apply = 0 changement. PROD non appliquée (attend GO lead, --env prod --yes).
# ============================================================================

workspace:
  id: coldtunnel
  name: Cold Tunnel — Veridian
  owner_email: robert.brunon@veridian.site
  plan: enterprise          # générosité maximale, pas de limite visible (pivot pricing)
  environment: prod         # notifuse.app.veridian.site

# ----------------------------------------------------------------------------
# Infra d'ENVOI : multi-SMTP (3 boîtes agences-veridian.fr) — round-robin
# par provider destinataire (cf. Lot ENVOI #19). La capacité globale s'aligne
# sur le nombre de senders dispo.
# ----------------------------------------------------------------------------
sending_integrations:
  - id: agences-relay
    type: email
    kind: smtp
    smtp:
      host: ${SMTP_AGENCES_HOST}     # 100.92.215.42 (Tailscale — voir note réseau)
      port: ${SMTP_AGENCES_PORT}     # 587
      use_tls: true
    senders:
      - email: ${SMTP_AGENCES_USER1} # robert.brunon@agences-veridian.fr
        password: ${SMTP_AGENCES_PW1}
        name: Robert Brunon
        is_default: true
      - email: ${SMTP_AGENCES_USER2} # r.brunon@agences-veridian.fr
        password: ${SMTP_AGENCES_PW2}
        name: Robert Brunon
      - email: ${SMTP_AGENCES_USER3} # robert-brunon@agences-veridian.fr
        password: ${SMTP_AGENCES_PW3}
        name: Robert Brunon
    veridian_tracking_domain: track.agences-veridian.fr   # ✅ DNS+TLS câblés 2026-06-15 : CNAME Cloudflare → notifuse.app.veridian.site (DNS-only) + routeur Traefik prod dynamic/agences-tracking.yml (cert Let's Encrypt DNS-01). HTTPS 200 sur /t/ vérifié depuis prod. Reste : poser CustomEndpointURL=https://track.agences-veridian.fr sur le workspace (settings owner) pour que Notifuse génère les liens dessus.

# ----------------------------------------------------------------------------
# Boîte de RETOUR IMAP : bounce-loop (NDR → suppression) + stop-on-reply.
# Notifuse poll cette boîte. OWNER-ONLY à configurer (auth user).
# ----------------------------------------------------------------------------
reply_inbox:
  type: imap
  imap:
    host: ${LARK_IMAP_HOST}          # imap.larksuite.com
    port: ${LARK_IMAP_PORT}          # 993
    username: ${LARK_IMAP_USERNAME}  # robert.brunon@veridian.site
    password: ${LARK_IMAP_PASSWORD}
    use_tls: true
    folder: INBOX
    polling_interval_seconds: 120

# ----------------------------------------------------------------------------
# Config COLD par classe de provider destinataire (rates/min + caps/jour + pixel).
# Réputation : prudent sur google/microsoft, plus large sur petits providers.
# Valeurs de DÉPART conservatrices (IP en warm-up) — à ajuster.
# ----------------------------------------------------------------------------
cold_outreach:
  per_recipient_daily_cap: 1         # anti-harcèlement : max 1 mail/jour/adresse
  provider_class_rates:              # emails / minute
    google: 0.5                      # 1 mail / 2 min (réputation)
    microsoft: 0.5
    yahoo_aol: 1
    freemail_fr: 1
    corporate: 2
    ovh: 1
    ionos: 1
    apple_icloud: 0.5
    security_gateway: 0.1            # ultra-prudent (anti-spam pro)
    other_hoster: 1
    corporate_selfhost: 1
  provider_class_daily_cap:          # emails / jour / classe (warm-up bas)
    google: 50
    microsoft: 50
    yahoo_aol: 30
    freemail_fr: 50
    corporate: 100
    security_gateway: 5
  open_pixel_by_class:               # pixel OFF gros providers (réputation)
    google: false
    microsoft: false
    yahoo_aol: true
    freemail_fr: true
    corporate: true

# ----------------------------------------------------------------------------
# Sending windows (Lot WINDOWS #21) — heures ouvrables. À appliquer quand livré.
# ----------------------------------------------------------------------------
sending_window:
  timezone: Europe/Paris
  days: [mon, tue, wed, thu, fri]
  hours: "09:00-18:00"

# ----------------------------------------------------------------------------
# Contenu : listes / templates / séquences cold (cadence J+0 / J+3 / J+7).
# Déclaré ici, appliqué via API (templates.create + automations.create + enroll).
# ⚠️ SQUELETTE — le COPY (objet + corps MJML) reste à écrire par Robert (sa voix
# commerciale). Spintax {A|B} supporté (Lot 6) pour varier le contenu par
# destinataire. Liquid {{ contact.first_name }} etc. disponible.
# NB : le CLI IAC applique listes+templates+séquences quand cette section est
# décommentée et le copy renseigné (endpoints templates.create / automations.create
# / automations.enroll — cf docs/AGENT-API.md).
# ----------------------------------------------------------------------------
lists:
  - id: cold-prospects
    name: Prospects cold (agences)

templates:
  - id: cold-step1            # J+0 — premier contact
    name: Cold — Initial
    subject: "{Bonjour|Bonsoir} {{ contact.first_name }}, {une question rapide|un mot rapide}"
    body_mjml: ""             # ⚠️ à écrire (skill notifuse-templates, charte Veridian)
  - id: cold-step2            # J+3 — relance 1
    name: Cold — Relance 1
    subject: "{Re|Suite à mon message} — {{ contact.first_name }}"
    body_mjml: ""             # ⚠️ à écrire
  - id: cold-step3            # J+7 — relance 2 (dernière)
    name: Cold — Relance 2
    subject: "{Dernier message|Je n'insiste plus} {{ contact.first_name }}"
    body_mjml: ""             # ⚠️ à écrire

sequences:
  - id: cold-cadence-j0-j3-j7
    name: Cold cadence J+0 / J+3 / J+7
    status: draft             # passer 'live' via automations.activate quand le copy est prêt
    list_id: cold-prospects
    trigger: { event_kind: contact.created, frequency: once }
    # Exit-on-reply (Lot 3+9) + exit-on-bounce (Lot 2) sont AUTOMATIQUES : le gate
    # ColdReplyChecker sort le contact dès réponse/bounce, à chaque tick. Rien à déclarer.
    nodes:
      - { id: n_step1, type: email, config: { template_id: cold-step1 }, next_node_id: n_wait1 }
      - { id: n_wait1, type: delay, config: { duration: 3, unit: days }, next_node_id: n_step2 }
      - { id: n_step2, type: email, config: { template_id: cold-step2 }, next_node_id: n_wait2 }
      - { id: n_wait2, type: delay, config: { duration: 4, unit: days }, next_node_id: n_step3 }
      - { id: n_step3, type: email, config: { template_id: cold-step3 } }
