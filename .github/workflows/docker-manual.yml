name: Docker Build and Push (Manual)

on:
  workflow_dispatch:
    inputs:
      tag:
        description: 'Docker tag to use (leave empty for latest)'
        required: false
        type: string
        default: 'latest'
      push:
        description: 'Push to registry'
        required: false
        type: boolean
        default: true

env:
  REGISTRY: docker.io
  IMAGE_NAME: notifuse/notifuse

jobs:
  build:
    # Cible arm64 retiree le 2026-09-28 (gitops-ci) : aucun runner arm64
    # auto-heberge dans le parc (mesure : nomad-v state, aucun job
    # "arm" hors swarmclaw), la prod ne consomme QUE linux/amd64 (le
    # veritable pipeline de deploy, veridian-ci.yml job `build`, ne build
    # jamais que amd64), et ce workflow pousse vers docker.io/notifuse/notifuse
    # (namespace Docker Hub upstream, PAS le notre) sans secrets
    # DOCKERHUB_USERNAME/DOCKERHUB_TOKEN configures sur ce depot (mesure :
    # `gh secret list`) - il echouait deja avant migration, arm64 ou pas.
    # Si un besoin arm64 reel apparait : buildx + QEMU sur ce meme runner x64
    # (setup-qemu-action), pas un second runner.
    strategy:
      fail-fast: true
      matrix:
        include:
          - platform: linux/amd64
            arch: amd64
    runs-on: ubuntu-latest  # gitops-ci-allow-hosted: depot PUBLIC (aucun cout, aucun code de PR n'atteint notre parc), pas besoin du tailnet
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        if: ${{ inputs.push }}
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=${{ inputs.tag || 'latest' }}

      - name: Build and push by digest
        if: ${{ inputs.push }}
        id: build
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          platforms: ${{ matrix.platform }}
          no-cache: true
          labels: ${{ steps.meta.outputs.labels }}
          outputs: type=image,name=${{ env.REGISTRY }}/${{ env.IMAGE_NAME }},push-by-digest=true,name-canonical=true,push=true

      - name: Build locally (no push)
        if: ${{ !inputs.push }}
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          platforms: ${{ matrix.platform }}
          no-cache: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          load: true

      - name: Attest per-arch image
        if: ${{ inputs.push }}
        uses: actions/attest-build-provenance@v1
        with:
          subject-name: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          subject-digest: ${{ steps.build.outputs.digest }}
          push-to-registry: true

      - name: Export digest
        if: ${{ inputs.push }}
        run: |
          mkdir -p "${{ runner.temp }}/digests"
          digest="${{ steps.build.outputs.digest }}"
          touch "${{ runner.temp }}/digests/${digest#sha256:}"

      - name: Upload digest
        if: ${{ inputs.push }}
        uses: actions/upload-artifact@v4
        with:
          name: digests-${{ matrix.arch }}
          path: ${{ runner.temp }}/digests/*
          if-no-files-found: error
          retention-days: 1

  merge:
    if: ${{ inputs.push }}
    needs: [build]
    runs-on: ubuntu-latest  # gitops-ci-allow-hosted: depot PUBLIC (aucun cout, aucun code de PR n'atteint notre parc), pas besoin du tailnet
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write

    steps:
      - name: Download digests
        uses: actions/download-artifact@v4
        with:
          path: ${{ runner.temp }}/digests
          pattern: digests-*
          merge-multiple: true

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Set up crane
        uses: imjasonh/setup-crane@v0.4

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=${{ inputs.tag || 'latest' }}

      - name: Create manifest list and push
        working-directory: ${{ runner.temp }}/digests
        run: |
          tag_args=$(jq -cr '.tags | map("-t " + .) | join(" ")' <<< "$DOCKER_METADATA_OUTPUT_JSON")
          src_args=""
          for f in *; do
            src_args="$src_args ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}@sha256:$f"
          done
          docker buildx imagetools create $tag_args $src_args

      - name: Get manifest digest
        id: digest
        run: |
          first_tag=$(jq -r '.tags[0]' <<< "$DOCKER_METADATA_OUTPUT_JSON")
          digest=$(crane digest "$first_tag")
          echo "digest=$digest" >> $GITHUB_OUTPUT
          echo "Manifest digest: $digest"

      - name: Attest manifest list
        uses: actions/attest-build-provenance@v1
        with:
          subject-name: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          subject-digest: ${{ steps.digest.outputs.digest }}
          push-to-registry: true

      - name: Output image details
        run: |
          echo "Image: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}"
          echo "Tags: ${{ steps.meta.outputs.tags }}"
          echo "Digest: ${{ steps.digest.outputs.digest }}"
          echo "Push: ${{ inputs.push }}"
          echo ""
          echo "Docker image successfully built and pushed."
          echo "Registry: ${{ env.REGISTRY }}"
          echo "Image: ${{ env.IMAGE_NAME }}"
