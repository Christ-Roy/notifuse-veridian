name: Claude Code

on:
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]
  issues:
    types: [opened, assigned]
  pull_request_review:
    types: [submitted]

jobs:
  claude:
    # Depot PUBLIC (mesure 2026-09-28, contrairement au "prive" suppose dans
    # l'audit initial) + runner self-hosted : sans filtre proprietaire,
    # N'IMPORTE QUEL commentateur GitHub pouvait declencher une session Claude
    # Code sur notre machine (quota Anthropic + execution sur l'infra
    # Veridian). Verrou ajoute en meme temps que la bascule self-hosted
    # (gitops-ci, 2026-09-28).
    if: |
      github.actor == 'Christ-Roy' && (
      (github.event_name == 'issue_comment' && contains(github.event.comment.body, '@claude')) ||
      (github.event_name == 'pull_request_review_comment' && contains(github.event.comment.body, '@claude')) ||
      (github.event_name == 'pull_request_review' && contains(github.event.review.body, '@claude')) ||
      (github.event_name == 'issues' && (contains(github.event.issue.body, '@claude') || contains(github.event.issue.title, '@claude'))))
    runs-on: [self-hosted, linux, x64]
    permissions:
      contents: read
      pull-requests: read
      issues: read
      id-token: write
      actions: read # Required for Claude to read CI results on PRs
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Run Claude Code
        id: claude
        uses: anthropics/claude-code-action@v1
        with:
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          
          # This is an optional setting that allows Claude to read CI results on PRs
          additional_permissions: |
            actions: read

          # Optional: Give a custom prompt to Claude. If this is not specified, Claude will perform the instructions specified in the comment that tagged it.
          # prompt: 'Update the pull request description to include a summary of changes.'

          # Optional: Add claude_args to customize behavior and configuration
          # See https://github.com/anthropics/claude-code-action/blob/main/docs/usage.md
          # or https://docs.anthropic.com/en/docs/claude-code/sdk#command-line for available options
          # claude_args: '--model claude-opus-4-1-20250805 --allowed-tools Bash(gh pr:*)'

      - name: Cleanup runner (always -- Constitution CI Sec.20)
        if: always()
        run: |
          set +e  # jamais faire echouer le job sur du nettoyage
          non_abouti=0
          if docker info >/dev/null 2>&1; then
            docker container prune -f
            docker image prune -f --filter "until=1h"
            docker volume prune -f --filter "label!=keep=true"
            docker buildx prune -f --keep-storage 10GB --filter "until=168h"
          else
            non_abouti=1
            echo "NETTOYAGE DOCKER NON ABOUTI -- ce n'est PAS rien a nettoyer."
            echo "   Le demon Docker est injoignable depuis ce runner (socket non"
            echo "   accessible, comportement attendu depuis la doctrine zero"
            echo "   socket Docker sur les runners)."
            echo "   Consequence : conteneurs, images et volumes s'accumulent sur"
            echo "   ce runner sans que rien ne les purge."
            echo "   Quoi faire : purger cote hote, ou retirer ces lignes si le"
            echo "   nettoyage est desormais assure ailleurs."
          fi
          sudo rm -rf /tmp/runner-${{ github.run_id }}-* 2>/dev/null
          df -h / | awk 'NR==2 {if ($5+0 > 80) print "Disque a", $5, "-- au-dessus du seuil de 80 %"}'
          [ "$non_abouti" -eq 1 ] && echo "::warning::nettoyage Docker non abouti sur ce runner (voir ci-dessus)"
          exit 0
