# === Veridian patch — workflow E2E console-suite (informative, non-bloquant) ===
#
# Suite Playwright qui exerce la console sur staging RÉEL après chaque push
# branche veridian. Couvre les §2-§5 du ticket
# `todo/2026-05-22-suite-e2e-playwright-console.md` :
#   - parcours authentification (auto-login URL, magic link, token falsifié)
#   - navigation workspace sidebar (11 écrans, vérif chunks lazy + Lingui)
#   - section Settings > Plan (label, badge plan_source, CTA Hub)
#   - responsive 375 / 768 / 1440 px
#
# Pourquoi un workflow SÉPARÉ de veridian-ci.yml :
#   1. Informative d'abord — un flaky ne doit PAS bloquer la promo prod.
#      Quand la suite sera mûre et stable plusieurs semaines, on la branchera
#      en `needs:` du job deploy-prod dans veridian-ci.yml.
#   2. Staging est Tailscale-only : la suite tourne sur le runner on-prem
#      dev-pub. Un runner GitHub hosted reçoit 403 avant même le réveil Sablier.
#   3. Découplage temporel — peut être relancé seul via workflow_dispatch
#      sans re-déclencher tout veridian-ci.yml.
#
# Déclenchement : appelée par la CI/CD principale après ses E2E bloquants, ou
# manuellement. Staging est Tailscale-only et le runner on-prem est unique :
# l'ordre séquentiel évite que la console attende le SHA pendant que le job de
# déploiement attend lui-même le runner.

name: Notifuse console E2E suite (informative)

on:
  workflow_call:
    inputs:
      wait_for_staging_deploy:
        description: 'Exiger que staging reflète le SHA courant'
        required: false
        type: boolean
        default: true
  workflow_dispatch:
    inputs:
      wait_for_staging_deploy:
        description: 'Attendre que staging reflète le SHA courant (max 10min)'
        required: false
        type: boolean
        default: true

# La suite est informative — pas de concurrency cancel-in-progress, on laisse
# les runs s'enchaîner pour avoir une trace de chaque commit même si la file
# d'attente grossit.
concurrency:
  group: notifuse-console-e2e-${{ github.ref }}
  cancel-in-progress: false

jobs:
  console-e2e:
    name: Console E2E sur staging réel (informative)
    runs-on: [self-hosted, linux, x64]
    timeout-minutes: 30
    # `continue-on-error` au niveau du job entier serait préférable mais
    # GitHub Actions ne le permet pas pour les single-job workflows. La
    # nature informative est portée par :
    #   1. L'absence de `needs:` côté workflows de deploy (veridian-ci.yml
    #      ne mentionne pas ce workflow).
    #   2. La doc du fichier (ce header) qui explique pourquoi on n'exige
    #      pas vert pour promote.
    # Si le team lead veut bloquer la promo dessus plus tard, ajouter
    # `needs:` côté veridian-ci.yml — pas besoin de modifier ce workflow.
    env:
      NOTIFUSE_URL: https://notifuse.staging.veridian.site
      TARGET_SHA: ${{ github.sha }}
      PLAYWRIGHT_CHROME_EXECUTABLE_PATH: /usr/bin/google-chrome
      PLAYWRIGHT_DISABLE_VIDEO: '1'
      # Le secret partagé entre veridian-ci.yml jobs et ce workflow.
      HUB_API_SECRET: ${{ secrets.NOTIFUSE_HUB_API_SECRET_STAGING }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.TARGET_SHA }}

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      # Attend que staging soit healthy ET (optionnellement) que /api/version
      # reflète le SHA courant. Évite de partir contre un staging dans un état
      # de migration ou un container en cours de swap.
      - name: Wait for staging healthy
        run: |
          for i in {1..30}; do
            SETUP=$(curl -fsS https://notifuse.staging.veridian.site/api/setup.status 2>/dev/null || true)
            if echo "$SETUP" | jq -e \
              'type == "object" and has("is_installed") and has("api_endpoint_configured")' >/dev/null 2>&1; then
              echo "Staging healthy after ${i}0s"
              break
            fi
            if [ $i -eq 30 ]; then
              echo "::error::Staging unhealthy after 5min"
              exit 1
            fi
            sleep 10
          done

      - name: Wait for staging to reflect current SHA (optionnel)
        if: inputs.wait_for_staging_deploy
        run: |
          # /api/version retourne le SHA du build courant. Si staging tourne
          # encore l'ancien build, on accepte (la suite est résiliente — elle
          # provisione son propre tenant et teste l'app, pas une feature
          # spécifique). On émet juste un warning.
          EXPECTED_SHA="${TARGET_SHA::8}"
          for i in {1..30}; do
            RESP=$(curl -sf https://notifuse.staging.veridian.site/api/version 2>/dev/null || echo "")
            if [ -n "$RESP" ]; then
              GOT_TAG=$(echo "$RESP" | jq -r '.tag // empty')
              if echo "$GOT_TAG" | grep -q "$EXPECTED_SHA"; then
                echo "✓ Staging reflète SHA courant ($GOT_TAG)"
                exit 0
              fi
            fi
            sleep 20
          done
          echo "::warning::Staging n'a pas atteint SHA $EXPECTED_SHA après 10min — tests lancés contre l'état courant de staging."
          exit 0

      - name: Install e2e deps
        run: |
          cd tests/e2e-veridian
          npm ci --no-audit --no-fund

      - name: Verify system Chrome
        run: |
          test -x "$PLAYWRIGHT_CHROME_EXECUTABLE_PATH"
          "$PLAYWRIGHT_CHROME_EXECUTABLE_PATH" --version

      - name: Run console-suite Playwright tests
        id: console-tests
        continue-on-error: true
        run: |
          cd tests/e2e-veridian
          npm run test:console-suite
        env:
          CI: '1'

      - name: Upload Playwright artifacts (always)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report-console-suite
          path: |
            tests/e2e-veridian/playwright-report-console-suite/
            tests/e2e-veridian/playwright-results-console-suite.json
            tests/e2e-veridian/test-results/
          retention-days: 14

      - name: Cleanup runner (always — Constitution §20)
        if: always()
        run: |
          docker container prune -f
          docker image prune -f --filter "until=1h"
          docker volume prune -f --filter "label!=keep=true"
          docker buildx prune -f --keep-storage 10GB --filter "until=168h" || true
          sudo rm -rf /tmp/runner-${{ github.run_id }}-* || true

      # Notification Telegram en cas de fail uniquement (pas de spam vert).
      # Robert sait que vert = OK, rouge = à regarder dans la queue UI/UX.
      - name: Telegram alert sur fail (informative)
        if: steps.console-tests.outcome == 'failure'
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          echo "::warning::Suite console informative en échec ; artefact Playwright conservé sans bloquer la CI/CD."
          if [ -z "${TELEGRAM_BOT_TOKEN:-}" ] || [ -z "${TELEGRAM_CHAT_ID:-}" ]; then
            echo "::notice::Telegram incomplet (token ou chat_id absent), skip notif"
            exit 0
          fi
          curl -fsS -X POST \
            "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage" \
            -d "chat_id=${TELEGRAM_CHAT_ID}" \
            --data-urlencode "text=⚠️ Notifuse console E2E (informative) FAIL sur ${GITHUB_SHA::8}. Voir https://github.com/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}" \
            >/dev/null || echo "::warning::Notification Telegram échouée (non bloquant)"
