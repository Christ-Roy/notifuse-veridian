name: Notifuse Veridian CI/CD

on:
  push:
    branches: [veridian]
    tags:
      - 'v*-veridian.*'
      - 'saas-v*'
    # === Veridian patch 2026-05-20 — Constitution §8 Path-based skip docs ===
    # Un commit docs/todo-only n'a pas besoin de build image, push GHCR,
    # deploy staging, e2e (~10min gaspillés). Le pre-push hook continue de
    # vérifier le mapping source↔test localement, donc on ne risque pas
    # un fichier critique sans test qui glisse.
    # Cf. todo/2026-05-19-ci-paths-ignore-docs.md
    paths-ignore:
      - '**.md'
      - 'docs/**'
      - 'todo/**'
      - 'CHANGELOG.md'
      - 'runbooks/**'
      - 'plans/**'
  pull_request:
    branches: [veridian]
    # Idem pour les PRs : pas de CI sur docs-only.
    paths-ignore:
      - '**.md'
      - 'docs/**'
      - 'todo/**'
      - 'CHANGELOG.md'
      - 'runbooks/**'
      - 'plans/**'
  workflow_dispatch:
    inputs:
      deploy_staging:
        description: 'Deploy to staging after build'
        required: false
        default: 'true'
      deploy_prod:
        description: 'Deploy to PROD (only after manual review — green/blue)'
        required: false
        default: 'false'
      skip_wipe:
        description: 'Skip wipe-test-tenants step (test manuel staging via Chrome)'
        required: false
        default: 'false'
      skip_e2e:
        description: 'Skip e2e-staging job (test manuel staging via Chrome)'
        required: false
        default: 'false'

concurrency:
  group: veridian-ci-${{ github.ref }}
  cancel-in-progress: true

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: christ-roy/notifuse-veridian
  GO_VERSION: '1.26.6'  # fixe CVE-2026-46600 et les avis stdlib précédents
  # Force Node 24 pour les actions JavaScript (deadline 2026-06-02 GitHub).
  # Avant : warnings de deprecation Node 20 sur actions/checkout@v4,
  # setup-node@v4, setup-go@v5, upload-artifact@v4, docker/build-push-action@v6,
  # docker/login-action@v3, docker/setup-buildx-action@v3.
  # Apres bascule officielle : on peut retirer cette variable, les versions
  # major des actions ferveront alors automatiquement Node 24.
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: 'true'

jobs:
  test-mapping:
    name: Constitution CI §1 (mapping source↔test)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Run check-test-mapping.sh
        run: |
          chmod +x scripts/ci/check-test-mapping.sh
          # PR : diff vs base ref. Push : diff vs before SHA. Sinon skip.
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            export BASE_REF="origin/${{ github.base_ref }}"
          elif [ "${{ github.event_name }}" = "push" ]; then
            BEFORE="${{ github.event.before }}"
            if [ -z "$BEFORE" ] || [ "$BEFORE" = "0000000000000000000000000000000000000000" ]; then
              export BASE_REF="origin/veridian"
            else
              export BASE_REF="$BEFORE"
            fi
          else
            echo "Event ${{ github.event_name }} : skip test-mapping"
            exit 0
          fi
          echo "BASE_REF=$BASE_REF"
          scripts/ci/check-test-mapping.sh
      # === Veridian — couverture rate-limit global (OWASP API4) ===
      # Transverse (pas lié au diff) : tourne sur tous les events. Bloque si le
      # middleware global a été dé-câblé d'app.go ; alerte (non bloquant) sur un
      # mux HTTP parallèle. Miroir CI du même check joué en pre-push.
      - name: Run check-rate-limit-coverage.sh
        run: |
          chmod +x scripts/ci/check-rate-limit-coverage.sh
          scripts/ci/check-rate-limit-coverage.sh
      - name: Plafonds ressources staging
        run: python3 scripts/ci/check-staging-resources.py

  # === Veridian patch — garde-fou « la console boote » (incident 2026-05-22) ===
  # Build la console + analyse statique du dist/ (intégrité des chunks, chunk
  # React atomique). Un manualChunks mal découpé peut mettre la console morte
  # au boot, invisible pour les tests unitaires Vitest/jsdom. Ce job est en
  # `needs` de `build` → une console cassée bloque la construction de l'image.
  console-build:
    name: Console build & intégrité chunks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install console deps
        run: |
          if [ -d console ] && [ -f console/package-lock.json ]; then
            cd console && npm ci --no-audit --no-fund
          else
            echo "console/ absent ou sans lockfile — skip"
            exit 0
          fi
      - name: Build console + check intégrité (check-console-build.sh)
        run: |
          chmod +x scripts/ci/check-console-build.sh
          scripts/ci/check-console-build.sh
      - name: Upload console/dist/ pour le job suivant (e2e-console-prod-smoke)
        uses: actions/upload-artifact@v4
        with:
          name: console-dist
          path: console/dist
          if-no-files-found: error
          retention-days: 1

  # === Veridian patch — suite E2E « production-build smoke » (ticket 2026-05-22) ===
  #
  # Pourquoi cette couche en plus de `console-build` :
  #   - `console-build` fait l'analyse STATIQUE du dist/ (chunks existent,
  #     react-vendor atomique). C'est rapide, mais ne charge JAMAIS la
  #     SPA dans un navigateur.
  #   - Ce job-ci sert dist/ via `vite preview` et fait monter la SPA
  #     dans Chromium headless. C'est là qu'on attrape :
  #       1. Le bug `createContext` au boot (uncaught JS exception).
  #       2. Les hash Lingui non-extractés affichés à l'écran.
  #     Les 2 incidents prod du 2026-05-22 que les 225 tests unitaires
  #     n'ont PAS vus parce qu'ils tournent en jsdom sur le code source.
  #
  # On ne refait PAS le build (sinon +5 min) : on récupère le dist/ de
  # `console-build` via artefact, puis `SKIP_BUILD=1 npm run test:prod-smoke`.
  #
  # Bloquant : si rouge, `build` (deploy staging) ne se déclenche pas.
  e2e-console-prod-smoke:
    name: E2E console — production-build smoke
    runs-on: ubuntu-latest
    needs: console-build
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install console deps
        run: cd console && npm ci --no-audit --no-fund
      - name: Récupère le dist/ depuis console-build (pas de rebuild)
        uses: actions/download-artifact@v4
        with:
          name: console-dist
          path: console/dist
      - name: Vérifie que le dist/ a bien atterri
        run: |
          set -e
          if [ ! -f console/dist/index.html ]; then
            echo "::error::console/dist/index.html absent après download-artifact"
            exit 1
          fi
          echo "Contenu du dist/ :"
          ls console/dist/
      - name: Install Playwright Chromium
        run: cd console && npx playwright install --with-deps chromium
      - name: Run prod-smoke E2E (skip build, réutilise dist/)
        run: cd console && npm run test:prod-smoke:skip-build
        env:
          CI: '1'
      - name: Upload playwright-report en cas d'échec
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report-prod-smoke
          path: console/playwright-report-prod-smoke
          retention-days: 7

  compose-validate:
    name: Compose validate (staging + prod)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate compose files
        run: |
          chmod +x scripts/ci/generate-compose.sh
          # `docker compose config --quiet` sur prod.yml et staging.yml.
          # Pas de génération côté repo (compose merge non reproductible cross-version).
          scripts/ci/generate-compose.sh staging prod

  # === Veridian patch 2026-05-20 — câblage Constitution CI §12 ===
  # check-migration-safety.sh existait mais n'était pas appelé directement.
  # Bloque les opérations destructives (DROP COLUMN, ALTER NOT NULL sur table
  # peuplée, etc.) sans la convention Expand & Contract documentée dans
  # CI-ARCHITECTURE.md §12. Override possible via `[safe-migration]` dans le
  # subject de commit pour les cas légitimes (ex: rollback ciblé).
  # Cf. todo/2026-05-19-ci-migration-safety-non-cable.md
  migration-safety:
    name: Constitution CI §12 (migrations Expand & Contract)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Run check-migration-safety.sh
        run: |
          chmod +x scripts/ci/check-migration-safety.sh
          # Même logique BASE_REF que test-mapping pour la cohérence.
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            export BASE_REF="origin/${{ github.base_ref }}"
          elif [ "${{ github.event_name }}" = "push" ]; then
            BEFORE="${{ github.event.before }}"
            if [ -z "$BEFORE" ] || [ "$BEFORE" = "0000000000000000000000000000000000000000" ]; then
              export BASE_REF="origin/veridian"
            else
              export BASE_REF="$BEFORE"
            fi
          else
            echo "Event ${{ github.event_name }} : skip migration-safety"
            exit 0
          fi
          echo "BASE_REF=$BASE_REF"
          # Override : [safe-migration] dans commit subject autorise opération destructive
          # (ex: rollback ciblé, suppression colonne déjà migrée 2 deploys avant).
          COMMIT_MSG=$(git log -1 --format='%s')
          if echo "$COMMIT_MSG" | grep -q '\[safe-migration\]'; then
            echo "ℹ Bypass via [safe-migration] (validation humaine) — Constitution §12 override"
            exit 0
          fi
          scripts/ci/check-migration-safety.sh

  workflow-lint:
    name: Constitution CI §20 (self-hosted jobs cleanup always())
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Lint workflows
        run: |
          chmod +x scripts/ci/lint-workflows.sh
          # Vérifie que tout job runs-on: self-hosted a un step if: always()
          # qui fait du cleanup (docker prune, df, sudo rm). Sans ça, le disk
          # dev-pub se remplit silencieusement et le runner crash.
          scripts/ci/lint-workflows.sh

  # === Veridian patch === Scan CVE bloquant (regle CLAUDE.md non-negociable
  # depuis breach 2026-05-07). Detecte high/critical sur tous les lockfiles npm
  # livres ou executes, et fail le pipeline avant build.
  cve-scan:
    name: CVE scan (npm audit)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: npm audit (all lockfiles)
        run: |
          # --audit-level=high : bloque sur high/critical, ignore moderate/low
          # (sinon CI fail tout le temps sur deps transitives non-actionnables).
          # Une erreur reseau/registre ou un JSON invalide est aussi bloquante :
          # le scanner ne doit jamais transformer une absence de resultat en vert.
          audit_lockfile() {
            local directory="$1"
            local label="$2"
            local audit_json audit_stderr audit_status high critical
            audit_json=$(mktemp)
            audit_stderr=$(mktemp)

            if (cd "$directory" && npm audit --audit-level=high --json >"$audit_json" 2>"$audit_stderr"); then
              audit_status=0
            else
              audit_status=$?
            fi

            if ! jq -e '.metadata.vulnerabilities | type == "object"' "$audit_json" >/dev/null; then
              echo "::error::npm audit did not return valid vulnerability metadata for ${label}"
              head -20 "$audit_stderr"
              head -20 "$audit_json"
              rm -f "$audit_json" "$audit_stderr"
              exit 1
            fi

            high=$(jq -r '.metadata.vulnerabilities.high // 0' "$audit_json")
            critical=$(jq -r '.metadata.vulnerabilities.critical // 0' "$audit_json")
            if [ "$high" -gt 0 ] || [ "$critical" -gt 0 ]; then
              echo "::error::npm audit found ${critical} critical + ${high} high CVEs in ${label}"
              jq -r '.vulnerabilities | to_entries[] | select(.value.severity == "critical" or .value.severity == "high") | "  - \(.key) (\(.value.severity))"' "$audit_json" | head -20
              rm -f "$audit_json" "$audit_stderr"
              exit 1
            fi

            if [ "$audit_status" -ne 0 ]; then
              echo "::error::npm audit failed for ${label} with exit code ${audit_status}"
              head -20 "$audit_stderr"
              rm -f "$audit_json" "$audit_stderr"
              exit "$audit_status"
            fi

            rm -f "$audit_json" "$audit_stderr"
            echo "npm audit (${label}) OK : 0 high/critical"
          }

          audit_lockfile tests/e2e-veridian "e2e tests"
          audit_lockfile console "console UI"
          audit_lockfile notification_center "notification center"

  test-go:
    name: Go tests (unit + Veridian patches)
    needs: [test-mapping, compose-validate, migration-safety]
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: test
          POSTGRES_DB: notifuse_test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true

      - name: Veridian-specific tests
        run: |
          go test -v -race -coverprofile=coverage.out \
            ./internal/domain/... \
            ./internal/repository/... \
            ./internal/service/... \
            ./internal/http/... \
            -run "Veridian" -timeout 120s

      - name: Upstream tests must still pass
        run: |
          go test -race -timeout 300s ./internal/domain/... ./internal/repository/... ./internal/service/... ./internal/http/...

      - name: Coverage report
        run: |
          go tool cover -func=coverage.out | grep -E "veridian" || true
          go tool cover -func=coverage.out | tail -1

      # Constitution CI §13 — govulncheck (équivalent Go de npm audit).
      # Détecte les CVE connues sur les deps Go directes et transitives,
      # mais uniquement les vulnerabilités effectivement appelées par
      # notre code (filtre les imports inertes).
      - name: Install govulncheck
        run: go install golang.org/x/vuln/cmd/govulncheck@latest

      - name: Run govulncheck
        run: |
          set -o pipefail
          govulncheck -show verbose ./... 2>&1 | tee govulncheck.txt
          # govulncheck exit code 3 = vulns trouvées avec appel détecté.
          # On veut fail dans ce cas, c'est l'intérêt du check.

  govulncheck-summary:
    name: govulncheck summary (after Go tests)
    needs: test-go
    runs-on: ubuntu-latest
    if: always()
    steps:
      - name: Sentinelle (test-go embedde le scan, ce job sert juste d'ancre)
        run: echo "govulncheck est exécuté dans test-go (step 'Run govulncheck')."

  trivy-fs:
    name: Trivy fs scan (CVE + secret + misconfig + license, Constitution §13)
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write  # pour upload SARIF dans GitHub Security tab
    steps:
      - uses: actions/checkout@v4
      - name: Trivy fs scan
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: 'fs'
          scan-ref: '.'
          scanners: 'vuln,secret,misconfig,license'
          severity: 'CRITICAL,HIGH'
          format: 'sarif'
          output: 'trivy-fs.sarif'
          # SARIF complet non bloquant ; le gate vulnérabilités HIGH/CRITICAL
          # séparé ci-dessous conserve un résultat lisible dans les logs.
          exit-code: '0'
          # === Veridian patch 2026-05-20 — Constitution §13 VEX allowlist ===
          # Allowlist versionnée avec justifications écrites + expires dates.
          # Cf. .trivyignore.yaml + todo/2026-05-19-ci-trivy-allowlist-yaml.md
          trivyignores: '.trivyignore.yaml'
      - name: Upload SARIF to GitHub Security tab
        uses: github/codeql-action/upload-sarif@v3
        if: always()
        continue-on-error: true  # ship fast — SARIF upload non bloquant
        with:
          sarif_file: 'trivy-fs.sarif'
          category: 'trivy-fs'
      - name: Fail on HIGH/CRITICAL dependency vulnerabilities
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: 'fs'
          scan-ref: '.'
          scanners: 'vuln'
          severity: 'CRITICAL,HIGH'
          format: 'table'
          exit-code: '1'
          trivyignores: '.trivyignore.yaml'

  gitleaks:
    name: Gitleaks (secrets dans le diff Git)
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0  # gitleaks scan tout l'historique court
      - name: Run gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Mode redact : ne pas exposer les secrets dans les logs publics
          GITLEAKS_ENABLE_COMMENTS: false
          GITLEAKS_ENABLE_UPLOAD_ARTIFACT: true
          GITLEAKS_ENABLE_SUMMARY: true

  build:
    name: Build & push image (GitHub-hosted)
    needs: [test-go, cve-scan, trivy-fs, gitleaks, console-build, e2e-console-prod-smoke]
    # Migré self-hosted (dev-pub) → ubuntu-latest le 2026-06-21 : dev-pub
    # (7.6G RAM / 72G disque, mutualisé staging 5 apps) saturait au build
    # (`no space left` / push GHCR `deadline exceeded`) → blocage total des promos.
    # Le build n'a AUCUNE dépendance dev-pub (context: ., cache type=gha, push
    # GHCR via token) → tourne sur runner GitHub (16G/14G, jamais saturé). Seuls
    # les jobs deploy-* restent self-hosted (ils SSH dans dev-pub, c'est leur rôle).
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      security-events: write  # upload SARIF Trivy image → GitHub Security tab
    outputs:
      image_tag: ${{ steps.meta.outputs.tag }}
      upstream_version: ${{ steps.meta.outputs.upstream }}
      is_saas_release: ${{ steps.meta.outputs.is_saas_release }}
      # === Veridian patch === Digest sha256 expose pour permettre au job
      # deploy-* de pinner image+digest dans infra/compose/*.yml (mode GitOps).
      # Sans ca, Dokploy redeploy avec le meme tag/digest faute de signal de
      # changement -> faux positif documente 2026-05-18.
      image_digest: ${{ steps.push.outputs.digest }}
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        run: |
          UPSTREAM=$(grep '^const VERSION' config/config.go | sed -E 's/.*"([^"]+)".*/\1/')
          SHA="${GITHUB_SHA::8}"
          if [[ "$GITHUB_REF" == refs/tags/saas-v* ]]; then
            # Release Veridian SemVer (saas-vX.Y.Z) — tag manuel, image
            # taggée et :latest mis à jour. Le redeploy prod est manuel
            # (edit du compose Dokploy pour pointer sur ce tag).
            TAG="${GITHUB_REF#refs/tags/}"
            IS_SAAS_RELEASE=true
          elif [[ "$GITHUB_REF" == refs/tags/* ]]; then
            TAG="${GITHUB_REF#refs/tags/}"
            IS_SAAS_RELEASE=false
          else
            TAG="v${UPSTREAM}-veridian.${SHA}"
            IS_SAAS_RELEASE=false
          fi
          echo "tag=${TAG}" >> $GITHUB_OUTPUT
          echo "upstream=${UPSTREAM}" >> $GITHUB_OUTPUT
          echo "is_saas_release=${IS_SAAS_RELEASE}" >> $GITHUB_OUTPUT
          echo "Image tag: ${TAG} (saas_release=${IS_SAAS_RELEASE})"

      # Skip pour les releases saas-v* : on ne touche pas à :latest ni à :rollback,
      # on ne fait qu'ajouter un tag SemVer immuable.
      - name: Retag previous :latest as :rollback
        if: steps.meta.outputs.is_saas_release != 'true'
        continue-on-error: true
        run: |
          docker pull ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest || exit 0
          docker tag ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:rollback
          docker push ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:rollback

      # Tag :latest n'est PAS mis à jour pour les releases saas-v* :
      # un tag SemVer release peut pointer sur n'importe quel commit
      # (rollback inclus) et ne doit pas écraser le :latest qui sert
      # le staging auto-deploy.
      - name: Compute image tags
        id: image_tags
        run: |
          BASE="${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}"
          if [[ "${{ steps.meta.outputs.is_saas_release }}" == "true" ]]; then
            echo "tags<<EOF" >> $GITHUB_OUTPUT
            echo "${BASE}:${{ steps.meta.outputs.tag }}" >> $GITHUB_OUTPUT
            echo "EOF" >> $GITHUB_OUTPUT
          else
            echo "tags<<EOF" >> $GITHUB_OUTPUT
            echo "${BASE}:${{ steps.meta.outputs.tag }}" >> $GITHUB_OUTPUT
            echo "${BASE}:latest" >> $GITHUB_OUTPUT
            echo "EOF" >> $GITHUB_OUTPUT
          fi

      - name: Build & push image
        id: push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          platforms: linux/amd64
          tags: ${{ steps.image_tags.outputs.tags }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          # === Veridian patch 2026-09-02 === le stage `runtime` (Dockerfile,
          # `FROM alpine:3.21 AS runtime`) est EXCLU du cache de couches, et les
          # images de base sont re-résolues à chaque build.
          #
          # Pourquoi : `RUN apk upgrade --no-cache` ne se réexécute jamais tant que
          # sa clé de cache est stable, or elle l'est (le tag alpine:3.21 pointe sur
          # le même digest pendant des semaines). Mesuré sur le run 33254429451 :
          # `#24 [stage-3 2/7] RUN apk upgrade … CACHED`. Conséquence : l'image
          # embarquait libpq 17.10-r0 (9 CVE HIGH d'exécution de code arbitraire)
          # alors que le miroir Alpine servait déjà 17.11-r0, et le gate Trivy
          # ci-dessous refusait de publier — donc aucun correctif ne pouvait passer.
          #
          # Le coût est de quelques secondes (apk upgrade sur alpine) ; tous les
          # autres stages (Go, npm) restent cachés.
          no-cache-filters: runtime
          pull: true
          # === Veridian patch === BUILD_TAG/SHA/DATE injectes dans
          # internal/buildinfo via -ldflags pour /api/version (defense
          # anti-faux-positif post-deploy). VERSION garde l'ancien nom pour
          # compat upstream (consume par UI console actuellement).
          build-args: |
            VERSION=${{ steps.meta.outputs.tag }}
            BUILD_TAG=${{ steps.meta.outputs.tag }}
            BUILD_SHA=${{ github.sha }}
            BUILD_DATE=${{ github.event.head_commit.timestamp || github.event.repository.updated_at }}

      # === Veridian patch === Scan CVE OS + libs systeme + libs upstream
      # bake dans l'image via Trivy. Constitution §13 étage 2.
      #
      # Strategie bloquante identique a npm audit :
      # - CRITICAL et HIGH → bloquent avant tout deploiement.
      # - `--exit-on-eol 1` : fail si OS distrib en EOL (alpine < 3.18).
      # - SARIF upload → GitHub Security tab pour drill-down.
      # - SBOM CycloneDX artifact → traçabilité supply-chain.
      - name: Trivy scan image — HIGH/CRITICAL + SARIF
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ steps.meta.outputs.tag }}
          severity: 'CRITICAL,HIGH'
          format: 'sarif'
          output: 'trivy-image.sarif'
          exit-code: '0'  # SARIF non bloquant, fail séparé sur HIGH/CRITICAL

      - name: Upload Trivy image SARIF
        uses: github/codeql-action/upload-sarif@v3
        if: always()
        continue-on-error: true  # ship fast — SARIF upload non bloquant, dépend du runner self-hosted token scope
        with:
          sarif_file: 'trivy-image.sarif'
          category: 'trivy-image'

      - name: Trivy fail on HIGH/CRITICAL + EOL
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ steps.meta.outputs.tag }}
          severity: 'CRITICAL,HIGH'
          format: 'table'
          exit-code: '1'
        env:
          TRIVY_EXIT_ON_EOL: '1'

      - name: Generate CycloneDX SBOM
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ steps.meta.outputs.tag }}
          scan-type: 'image'
          format: 'cyclonedx'
          output: 'sbom-cyclonedx.json'

      - name: Upload SBOM artifact
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: sbom-cyclonedx-${{ steps.meta.outputs.tag }}
          path: 'sbom-cyclonedx.json'
          retention-days: 90

      # === Cleanup dev-pub disk après chaque build self-hosted ===
      # Pattern choisi avec Robert 2026-05-24 : step CI au lieu de cron caché.
      # Le job qui crée la dette (push image + builder buildkit) la nettoie
      # ici, logs visibles dans GitHub Actions, traçable par run.
      #
      # 4 actions idempotentes, toutes non-bloquantes (|| true) :
      #   1. Images ghcr.io/christ-roy/notifuse-veridian-* : garde les 2 plus
      #      récentes + :latest + :rollback + celles utilisées par containers.
      #   2. Builders buildx orphelins (containers >24h non listés par
      #      `docker buildx ls`) : leur volume _state peut faire 2-5G chacun.
      #   3. Logs runner _diag/ >7j sur dev-pub.
      #   4. /tmp orphelins >24h matchant patterns CI connus.
      #
      # Cf. ticket veridian-infra/todo/2026-05-24-dev-pub-disk-saturation-structurel.md
      # pour le contexte global (dev-pub saturait à 91% sous charge CI normale).
      - name: Cleanup dev-pub disk (idempotent, non-bloquant)
        if: always()
        shell: bash
        run: |
          set +e  # never fail the build because of cleanup
          DISK_BEFORE=$(df -B1 / | tail -1 | awk '{print $3}')

          echo "=== 1. Rotation images notifuse-veridian (garde 2 plus récentes + :latest + :rollback) ==="
          REPO="ghcr.io/christ-roy/notifuse-veridian"
          # IDs à garder : 2 plus récentes (par date création) + :latest + :rollback + celles utilisées par containers
          KEEP=$(docker images "$REPO" --format '{{.ID}} {{.CreatedAt}}' | sort -k2 -r | head -2 | awk '{print $1}')
          KEEP="$KEEP $(docker images "$REPO:latest" --format '{{.ID}}' 2>/dev/null)"
          KEEP="$KEEP $(docker images "$REPO:rollback" --format '{{.ID}}' 2>/dev/null)"
          USED=$(docker ps --format '{{.Image}}' | grep "^$REPO" | xargs -r -I{} docker inspect {} --format '{{.Id}}' 2>/dev/null | sed 's/sha256://' | cut -c1-12)
          KEEP="$KEEP $USED"
          KEEP_UNIQ=$(echo "$KEEP" | tr ' ' '\n' | sort -u | grep -v '^$')

          REMOVED=0
          for id in $(docker images "$REPO" --format '{{.ID}}' | sort -u); do
            if ! echo "$KEEP_UNIQ" | grep -qx "$id"; then
              docker rmi "$id" 2>/dev/null && REMOVED=$((REMOVED+1))
            fi
          done
          echo "  → $REMOVED images notifuse supprimées"

          echo ""
          echo "=== 2. Builders Buildkit orphelins (containers >24h non listés par 'buildx ls') ==="
          ALIVE=$(docker buildx ls 2>/dev/null | grep -oE 'builder-[a-f0-9-]+' | sort -u || true)
          ORPHANS_REMOVED=0
          for c in $(docker ps -a --filter "name=buildx_buildkit_builder-" --format '{{.Names}}'); do
            uuid="${c#buildx_buildkit_builder-}"
            # Ne kill que si pas listé par buildx ls (= vraiment orphelin)
            if [ -n "$ALIVE" ] && ! echo "$ALIVE" | grep -q "$uuid"; then
              docker rm -f "$c" 2>/dev/null
              docker volume rm "${c}_state" 2>/dev/null
              ORPHANS_REMOVED=$((ORPHANS_REMOVED+1))
            fi
          done
          echo "  → $ORPHANS_REMOVED builders orphelins supprimés"

          echo ""
          echo "=== 3. Logs runner _diag/ >7 jours ==="
          DIAG_BEFORE=$(du -sm /home/ubuntu/actions-runner-notifuse-veridian/_diag 2>/dev/null | awk '{print $1}')
          find /home/ubuntu/actions-runner-notifuse-veridian/_diag -type f -mtime +7 -delete 2>/dev/null
          DIAG_AFTER=$(du -sm /home/ubuntu/actions-runner-notifuse-veridian/_diag 2>/dev/null | awk '{print $1}')
          echo "  → _diag/ : ${DIAG_BEFORE:-?}M → ${DIAG_AFTER:-?}M"

          echo ""
          echo "=== 4. /tmp orphelins CI >24h ==="
          TMP_REMOVED=0
          # Patterns CI connus : prosp-*, e2e-*, prisma-*, playwright_*, vrd-mig-*, etc.
          for pattern in 'prosp-*' 'e2e-*' 'prisma-*' 'playwright_*' 'playwright-*' 'vrd-mig-*' 'tmp.*' 'jiti' 'node-compile-cache'; do
            for f in /tmp/$pattern; do
              [ -e "$f" ] || continue
              # Skip si modifié dans les dernières 24h (pourrait être en cours d'usage)
              if [ -n "$(find "$f" -mmin +1440 -maxdepth 0 2>/dev/null)" ]; then
                rm -rf "$f" 2>/dev/null && TMP_REMOVED=$((TMP_REMOVED+1))
              fi
            done
          done
          echo "  → $TMP_REMOVED entrées /tmp orphelines supprimées"

          echo ""
          echo "=== Bilan disque ==="
          DISK_AFTER=$(df -B1 / | tail -1 | awk '{print $3}')
          DISK_PCT=$(df / | tail -1 | awk '{print $5}')
          FREED_MB=$(( (DISK_BEFORE - DISK_AFTER) / 1024 / 1024 ))
          echo "  Libéré : ${FREED_MB}M"
          echo "  Disque : $DISK_PCT used"
          # Warning si toujours >80% — on ship pas mais on flag visible
          PCT_NUM=$(echo "$DISK_PCT" | tr -d '%')
          if [ "$PCT_NUM" -gt 80 ]; then
            echo "::warning::dev-pub disk encore >80% ($DISK_PCT) après cleanup CI — investigation manuelle requise"
          fi
          exit 0

  deploy-staging:
    name: Deploy staging (GitOps Nomad SSH-bastion)
    needs: build
    # Staging deploy auto sur push veridian uniquement.
    # Tags saas-v* sont des releases prod : pas d'auto-deploy.
    if: github.ref == 'refs/heads/veridian'
    # Runner self-hosted dev-pub : le deploy passe par SSH-bastion (script), mais
    # les steps POST-deploy (wait healthy, cleanup tenants HMAC) tapent le staging
    # PRIVÉ (internal-only@nomad) → besoin du tailnet, d'où le runner dev-pub.
    runs-on: [self-hosted, linux, x64]
    permissions:
      contents: read
      packages: read
    environment:
      name: staging
      url: https://notifuse.staging.veridian.site
    env:
      # Secrets SSH partagés cross-app (canon prospection) — le NOMAD_TOKEN ne
      # quitte JAMAIS le bastion (lu in situ dans la session SSH).
      NOMAD_DEPLOY_SSH_KEY: ${{ secrets.NOMAD_DEPLOY_SSH_KEY }}
      NOMAD_BASTION_HOST: ${{ secrets.NOMAD_BASTION_HOST }}
      NOMAD_BASTION_USER: ${{ secrets.NOMAD_BASTION_USER }}
    steps:
      - uses: actions/checkout@v4

      # === GitOps Nomad SSH-bastion — scp le HCL (variable image_tag), pré-pull
      # l'image sur ovh-dev (auth ghcr du nœud), `nomad job run -var image_tag`
      # + deployment status -monitor. Le tag est passé en -var → pas de mutation
      # du HCL, donc PAS de commit-bump (traçabilité via le git SHA = le tag).
      - name: Deploy staging via SSH-bastion
        env:
          BUMP_TAG: ${{ needs.build.outputs.image_tag }}
        run: |
          set -euo pipefail
          chmod +x scripts/ci/nomad-ssh-deploy.sh
          scripts/ci/nomad-ssh-deploy.sh staging "$BUMP_TAG"

      - name: Wait for staging healthy
        run: |
          # Healthcheck en 2 étapes pour garantir qu'app+routes Veridian sont
          # toutes mountées avant les e2e :
          #   1. /api/setup.status — l'app HTTP répond
          #   2. /api/transactional.send (POST avec body bidon) — la route
          #      upstream est enregistrée dans le mux. On accepte 401/400/402 ;
          #      on refuse 404 (route absente = container pas prêt).
          #
          # Sans cette double-check, on a observé des flakies (run 25574039155)
          # où /api/transactional.send retournait `404 page not found` quelques
          # secondes après que setup.status soit healthy : le container avait
          # démarré le HTTP listener mais pas encore fini d'enregistrer toutes
          # les routes upstream. Les e2e démarraient et tombaient sur des 404.
          for i in {1..30}; do
            SETUP=$(curl -fsS https://notifuse.staging.veridian.site/api/setup.status 2>/dev/null || true)
            # Sablier répond HTTP 200 avec une page HTML pendant le réveil.
            # Seul le JSON de l'application prouve que l'API est réellement prête.
            if echo "$SETUP" | jq -e \
              'type == "object" and has("is_installed") and has("api_endpoint_configured")' >/dev/null 2>&1; then
              RESULT=$(curl -sS -o /tmp/transactional-health-body -w "%{http_code} %{content_type}" -X POST \
                -H "Content-Type: application/json" \
                -H "Authorization: Bearer health-check-fake-key" \
                -d '{}' \
                https://notifuse.staging.veridian.site/api/transactional.send)
              CODE="${RESULT%% *}"
              TYPE="${RESULT#* }"
              if [ "$CODE" != "404" ] && [[ "$TYPE" == application/json* ]]; then
                echo "Staging healthy after ${i} attempts (transactional.send → ${CODE}, ${TYPE})"
                exit 0
              fi
              echo "  attempt ${i}: setup.status JSON OK mais transactional.send → ${CODE} ${TYPE}"
            fi
            sleep 10
          done
          echo "Staging unhealthy after 5min"
          exit 1

      - name: Cleanup test tenants via admin API (proper, no SQL bricolage)
        if: github.event.inputs.skip_wipe != 'true'
        env:
          HUB_SECRET: ${{ secrets.NOTIFUSE_HUB_API_SECRET_STAGING }}
        run: |
          # Wipe via /api/veridian/admin/wipe-test-tenants (HMAC signed) :
          # appelle WorkspaceService.DeleteWorkspace upstream (DROP DATABASE
          # propre + workspace row) + planRepo.HardDelete sur la veridian_plan.
          # Skip les tenants matchant safety_client_prefixes (clients reels).
          # On wipe par chaque prefix de test connu (3+ chars min, pas de wildcard).
          #
          # === Veridian fix 2026-05-20 — flaky-ci-staging-postgres-saturation ===
          # Sérialisation avec sleep 1s entre prefixes pour ne pas saturer le pool
          # Postgres staging (`pq: sorry, too many clients already`). Coût +30s
          # mais évite ~5 re-runs/jour. Cf. todo/2026-05-20-flaky-ci-staging-postgres-saturation.md
          # Lot G 2026-05-21 : la feature include_orphans=true existe côté API
          # (workspaceRepo.List scan), mais on NE L'UTILISE PAS en batch CI.
          # Reason : run 26236522659 a montré que wiper en masse les orphelins
          # encore connectés par goroutines workspace fait crash le container
          # (DROP DATABASE avec connections actives → restart → healthcheck
          # planté). L'option reste activable manuellement par Robert via curl
          # à la demande pour les nettoyages ponctuels.
          for prefix in chaos magic stat paywall pwsus pwdel pwpath pwread autotest idem bump dbg smoke fresh statsus statdel up down unkplan resume sus mag genmag magtam magicre delconf e2e replaytest tampertest wrongsecret huge nofix wscre wscre2 uiguard direct paywsmoke; do
            BODY="{\"prefix\":\"${prefix}\"}"
            TS=$(date +%s%3N)
            SIG=$(echo -n "${TS}.${BODY}" | openssl dgst -sha256 -hmac "${HUB_SECRET}" -hex | awk '{print $2}')
            RESP=$(curl -sS -X POST "https://notifuse.staging.veridian.site/api/veridian/admin/wipe-test-tenants" \
              -H "Content-Type: application/json" \
              -H "X-Veridian-Hub-Signature: ${SIG}" \
              -H "X-Veridian-Timestamp: ${TS}" \
              -d "${BODY}")
            WIPED=$(echo "$RESP" | jq -r '.wiped | length' 2>/dev/null || echo "0")
            ERRORS=$(echo "$RESP" | jq -r '.errors | length' 2>/dev/null || echo "0")
            if [ "$WIPED" != "0" ] || [ "$ERRORS" != "0" ]; then
              echo "  prefix=${prefix} wiped=${WIPED} errors=${ERRORS}"
            fi
            sleep 1
          done
          # Verifier que staging repond toujours (les wipes ne doivent pas casser l'app)
          curl -sf https://notifuse.staging.veridian.site/api/setup.status > /dev/null && echo "Staging still healthy after cleanup" || (echo "Staging UNHEALTHY after cleanup" && exit 1)

      - name: Warmup pause après cleanup (anti-saturation pool DB)
        if: github.event.inputs.skip_wipe != 'true'
        run: |
          # === Veridian fix 2026-05-20 — flaky-ci-staging-postgres-saturation ===
          # Le cleanup wipe 38 prefixes (DROP DATABASE + DELETE rows) → laisse
          # le pool DB respirer 30s avant que l'e2e démarre avec sa rafale de
          # provisionTenant(). Sans ça, on hit `too many clients already`.
          echo "Warmup pause 30s avant e2e..."
          sleep 30
          curl -sf https://notifuse.staging.veridian.site/api/setup.status > /dev/null && echo "Pool DB OK" || (echo "Pool DB still under pressure" && exit 1)

      - name: Cleanup runner (always — Constitution §20)
        if: always()
        run: |
          docker container prune -f
          docker image prune -f --filter "until=1h"
          docker volume prune -f --filter "label!=keep=true"
          docker buildx prune -f --keep-storage 10GB --filter "until=168h" || true
          sudo rm -rf /tmp/runner-${{ github.run_id }}-* || true
          df -h / | awk 'NR==2 {if ($5+0 > 80) print "⚠ Disk:", $5, "used"}'

  e2e-staging:
    name: E2E headful Playwright (staging, BLOQUANT)
    needs: deploy-staging
    if: github.event.inputs.skip_e2e != 'true'
    runs-on: [self-hosted, linux, x64]
    env:
      NOTIFUSE_URL: https://notifuse.staging.veridian.site
      # Le CDN Playwright refuse géographiquement le runner OVH (HTTP 403).
      # Utiliser le Chrome système versionné par apt évite tout téléchargement.
      PLAYWRIGHT_CHROME_EXECUTABLE_PATH: /usr/bin/google-chrome
      # La vidéo requiert le FFmpeg privé de Playwright, servi par le même CDN.
      # Les traces et captures d'échec restent actives et suffisent au diagnostic.
      PLAYWRIGHT_DISABLE_VIDEO: '1'
      # HUB_URL retiré 2026-06-13 : plus aucune spec e2e-veridian ne tape le Hub
      # directement (la seule, MEGA-07 mail-gateway, supprimée au pivot stand-alone
      # 31/05). Les specs cross-app simulent le Hub vers Notifuse via HMAC
      # (HUB_API_SECRET). La valeur saas-hub.staging.veridian.site ne résolvait
      # de toute façon pas (ticket 2026-05-25-ci-hub-url-saas-hub-unreachable, clos).
      HUB_API_SECRET: ${{ secrets.NOTIFUSE_HUB_API_SECRET_STAGING }}
      # === Veridian patch 2026-05-22 — activer les tests E2E hub-sync-resilience ===
      # Le runner self-hosted tourne sur dev-pub, à côté du container postgres
      # staging. STAGING_DB_CONTAINER permet à hub-sync-resilience.spec.ts de
      # faire `docker exec ... psql` pour forcer last_hub_sync_at = NOW - 73h
      # sans exposer le port 5432.
      # ⚠️ Migration Nomad : le container n'est plus nommé `notifuse-staging-db`
      # (Dokploy) mais `db-<alloc_id>` (Nomad). Résolu dynamiquement ci-dessous
      # (step "Resolve staging DB container") → injecté dans GITHUB_ENV.
    steps:
      - uses: actions/checkout@v4
      - name: Wake staging and require the deployed API
        run: |
          set -euo pipefail
          EXPECTED_SHA="${GITHUB_SHA::8}"
          for i in {1..60}; do
            VERSION=$(curl -fsS https://notifuse.staging.veridian.site/api/version 2>/dev/null || true)
            if echo "$VERSION" | jq -e --arg sha "$EXPECTED_SHA" \
              '.git_sha | type == "string" and startswith($sha)' >/dev/null 2>&1; then
              echo "Staging API ready on SHA ${EXPECTED_SHA} after ${i} attempt(s)"
              exit 0
            fi
            echo "  attempt ${i}: Sablier démarre encore l'app ou le SHA déployé n'est pas prêt"
            sleep 10
          done
          echo "::error::Staging n'a jamais exposé l'API JSON du SHA ${EXPECTED_SHA}"
          exit 1
      - name: Resolve staging DB container (Nomad alloc)
        run: |
          set -euo pipefail
          # App et DB partagent l'alloc du group "stack" → même alloc_id.
          # container app = notifuse-<alloc>, container db = db-<alloc>.
          APP=$(docker ps --format '{{.Names}}' | grep -E '^notifuse-[0-9a-f-]{36}$' | head -1 || true)
          if [ -z "$APP" ]; then
            echo "::warning::container app staging Nomad introuvable — tests hub-sync-resilience seront skip"
          else
            ALLOC="${APP#notifuse-}"
            DB="db-${ALLOC}"
            if docker inspect "$DB" >/dev/null 2>&1; then
              echo "STAGING_DB_CONTAINER=${DB}" >> "$GITHUB_ENV"
              echo "✓ STAGING_DB_CONTAINER=${DB}"
            else
              echo "::warning::container db '$DB' introuvable — tests hub-sync-resilience seront skip"
            fi
          fi
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install Playwright
        run: |
          cd tests/e2e-veridian
          npm ci
          test -x "$PLAYWRIGHT_CHROME_EXECUTABLE_PATH"
          "$PLAYWRIGHT_CHROME_EXECUTABLE_PATH" --version
      - name: Run e2e
        run: |
          cd tests/e2e-veridian
          # Pas de --reporter=line ici : on utilise la config (line + html + json
          # en CI) pour qu'on ait artefacts utiles meme sur succes (analyse perfs)
          # et un rapport HTML drill-down sur fail.
          npx playwright test --project=chromium
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: playwright-report
          path: |
            tests/e2e-veridian/playwright-report/
            tests/e2e-veridian/playwright-results.json
            tests/e2e-veridian/test-results/
          retention-days: 14

  # === Gate §20 — staging vert SANS [risk:low] : reco/promotion attendue ===
  # Symétrique du gate sur deploy-prod : quand staging + e2e-staging passent
  # vert mais que le commit n'est PAS [risk:low] (donc deploy-prod a été skip),
  # ce job alerte Robert via Telegram qu'un commit tier 🟡/🔴 attend une reco
  # agent ou une promotion explicite (workflow_dispatch deploy_prod=true).
  # Sans ce job, le push resterait staging-only en silence et Robert ne saurait
  # pas qu'une décision de promotion est due. Job vert/no-op si rien à signaler.
  notify-promotion-needed:
    name: Notify Robert — staging vert, promotion prod attendue (§20)
    needs: e2e-staging
    if: |
      github.event_name == 'push' && github.ref == 'refs/heads/veridian'
      && !contains(github.event.head_commit.message, '[risk:low]')
      && !contains(github.event.head_commit.message, '[skip-prod]')
      && !contains(github.event.head_commit.message, '[wip]')
    runs-on: ubuntu-latest
    steps:
      - name: Telegram notify (promotion prod attendue)
        env:
          TG_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TG_CHAT: ${{ secrets.TELEGRAM_CHAT_ID }}
          COMMIT_MSG: ${{ github.event.head_commit.message }}
        run: |
          set -euo pipefail
          if [ -z "${TG_TOKEN:-}" ] || [ -z "${TG_CHAT:-}" ]; then
            echo "::notice::Telegram non configuré (TELEGRAM_BOT_TOKEN/CHAT_ID absents) — skip notif. Staging vert, promotion prod en attente de reco."
            exit 0
          fi
          SHA7=$(echo "${{ github.sha }}" | cut -c1-7)
          SUBJECT=$(echo "$COMMIT_MSG" | head -1)
          RUN_URL="https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          curl -sf -X POST "https://api.telegram.org/bot${TG_TOKEN}/sendMessage" \
            -d chat_id="${TG_CHAT}" \
            -d parse_mode=Markdown \
            --data-urlencode "text=🟡 Notifuse staging *vert* (\`${SHA7}\`) sans \`[risk:low]\` — promotion prod NON déclenchée automatiquement.%0A%0A_${SUBJECT}_%0A%0AReco agent attendue, ou promote manuelle : workflow_dispatch deploy_prod=true.%0A%0ARun : ${RUN_URL}" \
            >/dev/null || echo "::warning::Notif Telegram échouée (non bloquant)."
          echo "✓ Robert notifié — promotion prod en attente de reco/dispatch."

  # Suite console plus large, séquencée après le gate staging afin que le
  # runner Tailscale unique ne bloque jamais le déploiement qu'il doit tester.
  console-e2e-informative:
    name: Console E2E on-prem après staging
    needs: e2e-staging
    uses: ./.github/workflows/notifuse-console-e2e.yml
    with:
      wait_for_staging_deploy: true
    secrets: inherit

  deploy-prod:
    name: Deploy prod (auto-promote sur push veridian — ship fast & safe)
    # === Veridian fix 2026-05-18 === build dans needs sinon outputs vide.
    needs: [build, e2e-staging]
    # === Veridian patch === Auto-promote prod 2026-05-17, GATÉ §20 le 2026-06-10.
    #
    # ⚠️ CHANGEMENT DE MODÈLE (incident gouvernance 2026-06-10) : avant cette
    # date, l'auto-promote prod était INCONDITIONNELLE (opt-OUT via [skip-prod]).
    # Un commit tier 🔴 (throttle 7b813504) est parti en prod sans gate humain.
    # Désormais aligné sur Hub §20 : auto-promote en OPT-IN via marker `[risk:low]`.
    #
    # Conditions d'auto-promote (toutes doivent être vraies) :
    #   1. Event = push sur branche veridian (pas PR, pas tag, pas dispatch)
    #   2. e2e-staging vert (implicite via `needs`)
    #   3. Commit message CONTIENT [risk:low] (présence grossière ici ; le step
    #      "Check [risk:low] is in subject" durcit ensuite : doit être en 1ère ligne)
    #   4. Commit message ne contient PAS [skip-prod] ou [wip]
    #
    # Sans marker [risk:low] : staging seul + job `notify-promotion-needed`
    # alerte Robert (Telegram) que staging est vert et qu'une reco agent /
    # promotion explicite est attendue. Promotion manuelle = workflow_dispatch
    # avec deploy_prod=true (override toujours actif, ignore le marker).
    #
    # Defense in depth : e2e-prod reste bloquant après ce step, rollback
    # auto si fail, auto-revert Git PR. Donc même en cas de bug glissé
    # à travers e2e-staging, l'impact en prod est < 5 minutes.
    if: |
      (github.event_name == 'push' && github.ref == 'refs/heads/veridian'
        && contains(github.event.head_commit.message, '[risk:low]')
        && !contains(github.event.head_commit.message, '[skip-prod]')
        && !contains(github.event.head_commit.message, '[wip]'))
      || (github.event_name == 'workflow_dispatch' && github.event.inputs.deploy_prod == 'true')
    # Runner ubuntu-latest (canon SSH-bastion prospection) : le deploy SSH vers
    # l'IP publique du bastion + le smoke prod (public) ne nécessitent PAS le
    # tailnet. Le NOMAD_TOKEN ne quitte jamais le bastion.
    runs-on: ubuntu-latest
    env:
      NOMAD_DEPLOY_SSH_KEY: ${{ secrets.NOMAD_DEPLOY_SSH_KEY }}
      NOMAD_BASTION_HOST: ${{ secrets.NOMAD_BASTION_HOST }}
      NOMAD_BASTION_USER: ${{ secrets.NOMAD_BASTION_USER }}
    steps:
      # === Gate §20 — durcir le filtre [risk:low] : doit être en 1ère ligne ===
      # Le `if:` du job ne fait qu'un pré-filtre grossier (marker n'importe où
      # dans le message). Ce step échoue le job si le marker n'est PAS dans le
      # subject (1ère ligne) — empêche un agent de "claim" [risk:low] en le
      # glissant dans le body, ou de promote via un body qui mentionne le marker
      # pour expliquer son absence. Skip pour workflow_dispatch (override manuel
      # assumé par Robert, pas besoin de marker).
      - name: Check [risk:low] is in subject line (not just body)
        if: github.event_name == 'push'
        env:
          COMMIT_MSG: ${{ github.event.head_commit.message }}
        run: |
          set -euo pipefail
          SUBJECT=$(echo "$COMMIT_MSG" | head -1)
          if echo "$SUBJECT" | grep -q '\[risk:low\]'; then
            echo "✓ Marker [risk:low] dans le subject — auto-promote prod autorisée"
          else
            echo "::error::Marker [risk:low] absent du subject (présent dans le body uniquement) — promotion prod refusée. Cf. CLAUDE.md §9 / Hub CI-ARCHITECTURE §20."
            echo "Subject : $SUBJECT"
            exit 1
          fi

      - uses: actions/checkout@v4

      # === GitOps Nomad SSH-bastion — pré-pull l'image sur le bastion (auth ghcr
      # local), scp le HCL (variable image_tag), `nomad job run -var image_tag`
      # + deployment status -monitor (auto_revert Nomad si le deployment échoue).
      - name: Deploy prod via SSH-bastion
        env:
          BUMP_TAG: ${{ needs.build.outputs.image_tag }}
        run: |
          set -euo pipefail
          chmod +x scripts/ci/nomad-ssh-deploy.sh
          scripts/ci/nomad-ssh-deploy.sh prod "$BUMP_TAG"

      # === Smoke prod + anti-stale : /api/version doit renvoyer le tag déployé.
      # Si mismatch (Nomad n'a pas swap, mauvais tag) → job fail → job `rollback`.
      - name: Smoke prod (/api/version matches deployed tag)
        env:
          EXPECTED_TAG: ${{ needs.build.outputs.image_tag }}
        run: |
          set -euo pipefail
          for i in $(seq 1 30); do
            RESP=$(curl -sf https://notifuse.app.veridian.site/api/version 2>/dev/null || echo "")
            GOT=$(echo "$RESP" | jq -r '.tag // empty' 2>/dev/null || echo "")
            if [ "$GOT" = "$EXPECTED_TAG" ]; then
              echo "✓ Prod sert $GOT (== attendu)"; exit 0
            fi
            echo "  [$i/30] /api/version → ${GOT:-<vide>} (attendu $EXPECTED_TAG)"
            sleep 10
          done
          echo "::error::/api/version ≠ $EXPECTED_TAG après 5min — rollback auto va se déclencher"
          exit 1

      - name: Telegram notif deploy prod OK
        if: success()
        run: |
          if [ -n "${{ secrets.TELEGRAM_CHAT_ID }}" ]; then
            curl -fsS -X POST \
              "https://api.telegram.org/bot${{ secrets.TELEGRAM_BOT_TOKEN }}/sendMessage" \
              -d "chat_id=${{ secrets.TELEGRAM_CHAT_ID }}" \
              --data-urlencode "text=🚀 Notifuse Veridian PROD déployé — ${GITHUB_SHA::8} | e2e-prod en cours..."
          fi

  e2e-prod:
    name: E2E headful Playwright (prod, BLOQUANT)
    needs: deploy-prod
    runs-on: [self-hosted, linux, x64]
    env:
      NOTIFUSE_URL: https://notifuse.app.veridian.site
      PLAYWRIGHT_CHROME_EXECUTABLE_PATH: /usr/bin/google-chrome
      PLAYWRIGHT_DISABLE_VIDEO: '1'
      # HUB_URL retiré 2026-06-13 (cf. job e2e-staging) : aucune spec ne le lit.
      HUB_API_SECRET: ${{ secrets.NOTIFUSE_HUB_API_SECRET_PROD }}
      E2E_PROD_MODE: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: |
          cd tests/e2e-veridian
          npm ci
          test -x "$PLAYWRIGHT_CHROME_EXECUTABLE_PATH"
          "$PLAYWRIGHT_CHROME_EXECUTABLE_PATH" --version
          # Pas de --reporter=line ici : on utilise la config (line + html + json).
          npx playwright test --project=chromium --grep "@prod-safe"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: playwright-report-prod
          path: |
            tests/e2e-veridian/playwright-report/
            tests/e2e-veridian/playwright-results.json
            tests/e2e-veridian/test-results/
          retention-days: 14

  rollback:
    name: Rollback prod si e2e-prod fail
    needs: [e2e-prod, deploy-prod, build]
    if: failure() && needs.deploy-prod.result == 'success'
    # ubuntu-latest + SSH-bastion (canon) : le `nomad job revert` tourne sur le
    # bastion (token in situ), le curl prod est public.
    runs-on: ubuntu-latest
    env:
      NOMAD_DEPLOY_SSH_KEY: ${{ secrets.NOMAD_DEPLOY_SSH_KEY }}
      NOMAD_BASTION_HOST: ${{ secrets.NOMAD_BASTION_HOST }}
      NOMAD_BASTION_USER: ${{ secrets.NOMAD_BASTION_USER }}
    steps:
      # === Rollback Nomad via SSH-bastion — revient à la version de job PRÉCÉDENTE
      # (Nomad garde l'historique des versions avec leur image_tag figé). Atomique.
      # Le revert tourne IN SITU sur le bastion (token n'en sort pas).
      - name: Nomad job revert (version précédente) via SSH-bastion
        run: |
          set -euo pipefail
          umask 077
          printf '%s\n' "$NOMAD_DEPLOY_SSH_KEY" > /tmp/nomad_ci_key
          chmod 600 /tmp/nomad_ci_key
          ssh-keyscan -H "$NOMAD_BASTION_HOST" >> ~/.ssh/known_hosts 2>/dev/null || true
          ssh -i /tmp/nomad_ci_key -o StrictHostKeyChecking=accept-new \
            "${NOMAD_BASTION_USER}@${NOMAD_BASTION_HOST}" 'bash -s' <<'REMOTE'
          set -euo pipefail
          source ~/credentials/nomad-bastion.env
          export NOMAD_ADDR NOMAD_TOKEN="$NOMAD_MGMT_TOKEN"
          # Versions triées desc : [0]=courante (cassée), [1]=précédente (saine).
          PREV=$(/usr/bin/nomad job history -json notifuse \
                 | python3 -c 'import sys,json;v=sorted((x["Version"] for x in json.load(sys.stdin)),reverse=True);print(v[1] if len(v)>1 else "")')
          [ -n "$PREV" ] || { echo "::error::Pas de version précédente pour notifuse"; exit 1; }
          echo "▶ nomad job revert notifuse → version $PREV"
          /usr/bin/nomad job revert notifuse "$PREV"
          REMOTE
          rm -f /tmp/nomad_ci_key
          # Attendre que prod re-serve la version saine (public)
          for i in $(seq 1 30); do
            if curl -sf https://notifuse.app.veridian.site/api/setup.status > /dev/null 2>&1; then
              echo "✓ Prod re-healthy après revert"; exit 0
            fi
            sleep 10
          done
          echo "::error::Prod toujours unhealthy 5min après revert — intervention manuelle"
          exit 1

      - name: Notify Telegram
        if: always()  # on alerte le rollback quoi qu'il arrive
        run: |
          curl -X POST \
            "https://api.telegram.org/bot${{ secrets.TELEGRAM_BOT_TOKEN }}/sendMessage" \
            -d "chat_id=${{ secrets.TELEGRAM_CHAT_ID }}" \
            --data-urlencode "text=🚨 Notifuse Veridian PROD rollback — e2e-prod a fail sur ${GITHUB_SHA::8}, image precedente restauree."

      # === Constitution CI §17 — emergency-revert ===
      # Tout auto-rollback Docker DOIT déclencher un revert Git auto sur main
      # + freeze de main jusqu'à merge du revert (via branch protection :
      # nouveau commit sur veridian refusé tant que la PR de revert ouverte
      # par ce step n'est pas mergée).
      #
      # Implem :
      #   1. Crée une branche `emergency-revert-<sha>` qui revert le commit
      #      qui a déclenché le run cassé.
      #   2. Ouvre une PR avec label `emergency-rollback` (le ruleset
      #      "veridian-protected" doit bloquer les merges vers veridian
      #      tant qu'une PR avec ce label existe — config dépôt manuelle,
      #      pas faisable depuis le workflow).
      #
      # Le checkout en mode "actor=github-actions" exige un PAT avec scope
      # `repo` pour pouvoir push une branche + créer la PR. À défaut le step
      # WARN sans bloquer le rollback Docker (qui est déjà parti).
      - name: Auto-revert Git du commit cassé + ouvre PR
        if: always()
        continue-on-error: true
        run: |
          if [ -z "${{ secrets.EMERGENCY_REVERT_PAT }}" ]; then
            echo "::warning::EMERGENCY_REVERT_PAT non configuré — skip auto-revert Git (le rollback Docker reste appliqué)"
            exit 0
          fi
          set -euo pipefail
          BROKEN_SHA="${GITHUB_SHA}"
          REVERT_BRANCH="emergency-revert-${BROKEN_SHA::8}"

          # Setup git via le PAT (le GITHUB_TOKEN par défaut n'a pas le
          # droit de créer une PR depuis un push).
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git remote set-url origin "https://x-access-token:${{ secrets.EMERGENCY_REVERT_PAT }}@github.com/${GITHUB_REPOSITORY}.git"

          # Fetch full history (le rollback job est ubuntu-latest, checkout
          # default = depth 1).
          git fetch origin veridian --depth=20
          git checkout veridian
          git checkout -b "$REVERT_BRANCH"

          # Revert non-interactif. -n = no-commit pour pouvoir custom le msg.
          if ! git revert --no-edit "$BROKEN_SHA"; then
            echo "::error::Revert automatique a fail (conflit ?). Intervention manuelle requise."
            exit 1
          fi

          git push origin "$REVERT_BRANCH"

          gh pr create \
            --base veridian \
            --head "$REVERT_BRANCH" \
            --title "[EMERGENCY ROLLBACK] revert ${BROKEN_SHA::8}" \
            --label emergency-rollback \
            --body "PR auto-générée par le job rollback du workflow CI. Le commit \`${BROKEN_SHA::8}\` a fait fail e2e-prod après deploy-prod ; image Docker déjà rollback en prod via Dokploy. Cette PR remet le code git en cohérence avec l'image en prod. Reviewer le revert puis merger pour débloquer main."
        env:
          GH_TOKEN: ${{ secrets.EMERGENCY_REVERT_PAT }}

      # === Constitution CI §17 — Freeze branch protection ===
      # Tant que la PR auto-revert n'est pas mergée, on bloque tout
      # nouveau push sur `veridian` via une protection de branche avec
      # un status check fictif `FREEZE_LOCK` qui n'existera jamais.
      #
      # Le déverrouillage est porté par `unfreeze-after-revert.yml` :
      # il se déclenche quand la PR auto-revert (label emergency-rollback)
      # est mergée vers veridian et supprime la protection.
      #
      # `enforce_admins: false` pour permettre à Robert de bypass via
      # l'UI GitHub si urgent. PAT requis : scope repo + admin:repo
      # (`EMERGENCY_REVERT_PAT` partagé avec le step revert).
      #
      # Voir : todo/2026-05-19-ci-freeze-main-rollback.md
      - name: Freeze branch protection on veridian
        if: always()
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.EMERGENCY_REVERT_PAT }}
        run: |
          if [ -z "${{ secrets.EMERGENCY_REVERT_PAT }}" ]; then
            echo "::warning::EMERGENCY_REVERT_PAT non configuré — skip freeze branch protection (rollback Docker reste appliqué)"
            exit 0
          fi
          set -euo pipefail
          echo "Activation de la branch protection avec status check fictif FREEZE_LOCK sur veridian"
          # Construit le payload JSON via printf (heredoc serait piégé par
          # l'indent YAML — bash <<'JSON' exige terminator sans espaces).
          PAYLOAD=$(printf '%s' '{"required_status_checks":{"strict":true,"contexts":["FREEZE_LOCK"]},"enforce_admins":false,"required_pull_request_reviews":null,"restrictions":null,"allow_force_pushes":false,"allow_deletions":false}')
          if ! echo "$PAYLOAD" | gh api "repos/${GITHUB_REPOSITORY}/branches/veridian/protection" \
            --method PUT \
            --input -; then
            echo "::warning::Branch protection PUT a échoué — vérifier scope du PAT (repo + admin:repo)"
            exit 0
          fi
          echo "Branch protection activée : tout push sur veridian sera rejeté tant que FREEZE_LOCK n'est pas vert (jamais)."

      - name: Telegram alert freeze
        if: always()
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          if [ -z "${TELEGRAM_BOT_TOKEN:-}" ]; then
            echo "::notice::Pas de TELEGRAM_BOT_TOKEN, skip notif freeze"
            exit 0
          fi
          curl -sS -X POST \
            "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage" \
            -d "chat_id=${TELEGRAM_CHAT_ID}" \
            --data-urlencode "text=🧊 Notifuse Veridian — branche veridian FREEZE après auto-rollback prod sur ${GITHUB_SHA::8}. Push bloqués jusqu'au merge de la PR emergency-rollback. Bypass possible via UI GitHub si urgent."
