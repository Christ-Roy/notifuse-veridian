name: Notifuse Veridian CI/CD

on:
  push:
    branches: [veridian]
    tags:
      - 'v*-veridian.*'
      - 'saas-v*'
  pull_request:
    branches: [veridian]
  workflow_dispatch:
    inputs:
      deploy_staging:
        description: 'Deploy to staging after build'
        required: false
        default: 'true'
      deploy_prod:
        description: 'Deploy to PROD (only after manual review — green/blue)'
        required: false
        default: 'false'
      skip_wipe:
        description: 'Skip wipe-test-tenants step (test manuel staging via Chrome)'
        required: false
        default: 'false'
      skip_e2e:
        description: 'Skip e2e-staging job (test manuel staging via Chrome)'
        required: false
        default: 'false'
      promote_prod_compose:
        description: 'PUSH compose prod vers notifuse-deploy → webhook Dokploy → redeploy prod (opt-in)'
        required: false
        default: 'false'

concurrency:
  group: veridian-ci-${{ github.ref }}
  cancel-in-progress: true

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: christ-roy/notifuse-veridian
  GO_VERSION: '1.25'
  # Force Node 24 pour les actions JavaScript (deadline 2026-06-02 GitHub).
  # Avant : warnings de deprecation Node 20 sur actions/checkout@v4,
  # setup-node@v4, setup-go@v5, upload-artifact@v4, docker/build-push-action@v6,
  # docker/login-action@v3, docker/setup-buildx-action@v3.
  # Apres bascule officielle : on peut retirer cette variable, les versions
  # major des actions ferveront alors automatiquement Node 24.
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: 'true'

jobs:
  test-mapping:
    name: Constitution CI §1 (mapping source↔test)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Run check-test-mapping.sh
        run: |
          chmod +x scripts/ci/check-test-mapping.sh
          # PR : diff vs base ref. Push : diff vs before SHA. Sinon skip.
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            export BASE_REF="origin/${{ github.base_ref }}"
          elif [ "${{ github.event_name }}" = "push" ]; then
            BEFORE="${{ github.event.before }}"
            if [ -z "$BEFORE" ] || [ "$BEFORE" = "0000000000000000000000000000000000000000" ]; then
              export BASE_REF="origin/main"
            else
              export BASE_REF="$BEFORE"
            fi
          else
            echo "Event ${{ github.event_name }} : skip test-mapping"
            exit 0
          fi
          echo "BASE_REF=$BASE_REF"
          scripts/ci/check-test-mapping.sh

  compose-validate:
    name: Compose validate (staging + prod)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate compose files
        run: |
          chmod +x scripts/ci/generate-compose.sh
          # `docker compose config --quiet` sur prod.yml et staging.yml.
          # Pas de génération côté repo (compose merge non reproductible cross-version).
          scripts/ci/generate-compose.sh staging prod

  # === Veridian patch === Scan CVE bloquant (regle CLAUDE.md non-negociable
  # depuis breach 2026-05-07). Detecte high/critical sur deps npm de la suite
  # e2e + console UI, fail le pipeline avant build.
  cve-scan:
    name: CVE scan (npm audit)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      # tests/e2e-veridian : deps Playwright + types/node
      - name: npm audit (e2e tests)
        run: |
          cd tests/e2e-veridian
          # --audit-level=high : bloque sur high/critical, ignore moderate/low
          # (sinon CI fail tout le temps sur deps transitives non-actionnables).
          # On ignore le exit code et on parse le JSON pour avoir un message clair.
          AUDIT_OUT=$(npm audit --audit-level=high --json 2>/dev/null || true)
          HIGH=$(echo "$AUDIT_OUT" | jq -r '.metadata.vulnerabilities.high // 0')
          CRIT=$(echo "$AUDIT_OUT" | jq -r '.metadata.vulnerabilities.critical // 0')
          if [ "${HIGH}" -gt 0 ] || [ "${CRIT}" -gt 0 ]; then
            echo "::error::npm audit found ${CRIT} critical + ${HIGH} high CVEs in tests/e2e-veridian"
            echo "$AUDIT_OUT" | jq -r '.vulnerabilities | to_entries[] | "  - \(.key) (\(.value.severity))"' | head -20
            exit 1
          fi
          echo "npm audit (e2e) OK : 0 high/critical"

      # console : deps frontend (React, Ant, ...) — geré par upstream Notifuse,
      # pas patche par les Veridian patches. CVE detectees ici = bug upstream
      # a remonter via PR, pas a "audit fix" aveuglement (risque de breaking
      # deps majeur pour les fixes high). Donc ce step WARN seulement, ne fail
      # pas. Doit etre visible dans logs CI pour suivi.
      #
      # CRITICAL en console = STILL BLOQUANT (pas tolerable, meme upstream).
      # HIGH = warning, on tolere temporairement en attendant merge upstream
      # ou Veridian patch dedie. A revoir trimestriellement.
      - name: npm audit (console UI)
        run: |
          if [ -d console ] && [ -f console/package-lock.json ]; then
            cd console
            AUDIT_OUT=$(npm audit --audit-level=critical --json 2>/dev/null || true)
            HIGH=$(echo "$AUDIT_OUT" | jq -r '.metadata.vulnerabilities.high // 0')
            CRIT=$(echo "$AUDIT_OUT" | jq -r '.metadata.vulnerabilities.critical // 0')

            # === Veridian CVE allowlist (documented) ===
            # GHSA-rmmr-r34h-pfm5 : malware in @tanstack/history versions 1.161.9 + 1.161.12,
            # published 2026-05-11 19:20/26 UTC, advisory created 2026-05-11 23:39 UTC.
            # The advisory uses a defensive range `>= 0` which flags ALL versions,
            # including 1.161.6 (published 2026-03-15, BEFORE the attack — verifiably clean).
            # We pin via `overrides` in package.json. The integrity hash of 1.161.6 in our
            # package-lock matches the npm registry hash, confirming the original tarball.
            # All downstream @tanstack/* packages flagged here cascade from @tanstack/history,
            # so the count drops to 0 critical once we ignore this GHSA.
            # To re-arm : remove this allowlist once TanStack republishes a clean version
            # that supersedes 1.161.9/12 and the advisory range is narrowed.
            CRIT_NON_TANSTACK=$(echo "$AUDIT_OUT" | jq -r '
              [.vulnerabilities | to_entries[]
                | select(.value.severity == "critical")
                | select(.key | startswith("@tanstack/") | not)
              ] | length')

            if [ "${CRIT_NON_TANSTACK}" -gt 0 ]; then
              echo "::error::npm audit found ${CRIT_NON_TANSTACK} CRITICAL CVEs in console (excluding allowlisted @tanstack/*, BLOQUANT)"
              echo "$AUDIT_OUT" | jq -r '.vulnerabilities | to_entries[] | select(.value.severity == "critical") | select(.key | startswith("@tanstack/") | not) | "  - \(.key) (\(.value.severity)): \(.value.via | tostring)"' | head -10
              exit 1
            fi
            if [ "${CRIT}" -gt 0 ]; then
              echo "::warning::npm audit found ${CRIT} CRITICAL CVEs in console — ALL on @tanstack/* (GHSA-rmmr-r34h-pfm5), allowlisted because pinned to clean version 1.161.6"
            fi
            if [ "${HIGH}" -gt 0 ]; then
              echo "::warning::npm audit found ${HIGH} HIGH CVEs in console (deps upstream Notifuse, a remonter)"
              echo "$AUDIT_OUT" | jq -r '.vulnerabilities | to_entries[] | select(.value.severity == "high") | "  - \(.key) (high)"' | head -10
            fi
            echo "npm audit (console) OK : 0 non-allowlisted critical (${HIGH} high warnings)"
          else
            echo "console/ skip (no package-lock.json)"
          fi

  test-go:
    name: Go tests (unit + Veridian patches)
    needs: [test-mapping, compose-validate]
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: test
          POSTGRES_DB: notifuse_test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true

      - name: Veridian-specific tests
        run: |
          go test -v -race -coverprofile=coverage.out \
            ./internal/domain/... \
            ./internal/repository/... \
            ./internal/service/... \
            ./internal/http/... \
            -run "Veridian" -timeout 120s

      - name: Upstream tests must still pass
        run: |
          go test -race -timeout 300s ./internal/domain/... ./internal/repository/... ./internal/service/... ./internal/http/...

      - name: Coverage report
        run: |
          go tool cover -func=coverage.out | grep -E "veridian" || true
          go tool cover -func=coverage.out | tail -1

      # Constitution CI §13 — govulncheck (équivalent Go de npm audit).
      # Détecte les CVE connues sur les deps Go directes et transitives,
      # mais uniquement les vulnerabilités effectivement appelées par
      # notre code (filtre les imports inertes).
      - name: Install govulncheck
        run: go install golang.org/x/vuln/cmd/govulncheck@latest

      - name: Run govulncheck
        run: |
          set -o pipefail
          govulncheck -show verbose ./... 2>&1 | tee govulncheck.txt
          # govulncheck exit code 3 = vulns trouvées avec appel détecté.
          # On veut fail dans ce cas, c'est l'intérêt du check.

  govulncheck-summary:
    name: govulncheck summary (after Go tests)
    needs: test-go
    runs-on: ubuntu-latest
    if: always()
    steps:
      - name: Sentinelle (test-go embedde le scan, ce job sert juste d'ancre)
        run: echo "govulncheck est exécuté dans test-go (step 'Run govulncheck')."

  trivy-fs:
    name: Trivy fs scan (CVE + secret + misconfig + license, Constitution §13)
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write  # pour upload SARIF dans GitHub Security tab
    steps:
      - uses: actions/checkout@v4
      - name: Trivy fs scan
        uses: aquasecurity/trivy-action@0.33.0
        with:
          scan-type: 'fs'
          scan-ref: '.'
          scanners: 'vuln,secret,misconfig,license'
          severity: 'CRITICAL,HIGH'
          format: 'sarif'
          output: 'trivy-fs.sarif'
          # Ne pas fail le build sur HIGH (sinon dette upstream Notifuse
          # bloque tout). Critical-only via étape suivante.
          exit-code: '0'
          ignore-unfixed: 'true'
      - name: Upload SARIF to GitHub Security tab
        uses: github/codeql-action/upload-sarif@v3
        if: always()
        with:
          sarif_file: 'trivy-fs.sarif'
          category: 'trivy-fs'
      - name: Fail on CRITICAL only
        uses: aquasecurity/trivy-action@0.33.0
        with:
          scan-type: 'fs'
          scan-ref: '.'
          scanners: 'vuln,secret,misconfig'
          severity: 'CRITICAL'
          format: 'table'
          exit-code: '1'
          ignore-unfixed: 'true'

  gitleaks:
    name: Gitleaks (secrets dans le diff Git)
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0  # gitleaks scan tout l'historique court
      - name: Run gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Mode redact : ne pas exposer les secrets dans les logs publics
          GITLEAKS_ENABLE_COMMENTS: false
          GITLEAKS_ENABLE_UPLOAD_ARTIFACT: true
          GITLEAKS_ENABLE_SUMMARY: true

  build:
    name: Build & push image (self-hosted)
    needs: [test-go, cve-scan, trivy-fs, gitleaks]
    runs-on: [self-hosted, linux, x64]
    permissions:
      contents: read
      packages: write
    outputs:
      image_tag: ${{ steps.meta.outputs.tag }}
      upstream_version: ${{ steps.meta.outputs.upstream }}
      is_saas_release: ${{ steps.meta.outputs.is_saas_release }}
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        run: |
          UPSTREAM=$(grep '^const VERSION' config/config.go | sed -E 's/.*"([^"]+)".*/\1/')
          SHA="${GITHUB_SHA::8}"
          if [[ "$GITHUB_REF" == refs/tags/saas-v* ]]; then
            # Release Veridian SemVer (saas-vX.Y.Z) — tag manuel, image
            # taggée et :latest mis à jour. Le redeploy prod est manuel
            # (edit du compose Dokploy pour pointer sur ce tag).
            TAG="${GITHUB_REF#refs/tags/}"
            IS_SAAS_RELEASE=true
          elif [[ "$GITHUB_REF" == refs/tags/* ]]; then
            TAG="${GITHUB_REF#refs/tags/}"
            IS_SAAS_RELEASE=false
          else
            TAG="v${UPSTREAM}-veridian.${SHA}"
            IS_SAAS_RELEASE=false
          fi
          echo "tag=${TAG}" >> $GITHUB_OUTPUT
          echo "upstream=${UPSTREAM}" >> $GITHUB_OUTPUT
          echo "is_saas_release=${IS_SAAS_RELEASE}" >> $GITHUB_OUTPUT
          echo "Image tag: ${TAG} (saas_release=${IS_SAAS_RELEASE})"

      # Skip pour les releases saas-v* : on ne touche pas à :latest ni à :rollback,
      # on ne fait qu'ajouter un tag SemVer immuable.
      - name: Retag previous :latest as :rollback
        if: steps.meta.outputs.is_saas_release != 'true'
        continue-on-error: true
        run: |
          docker pull ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest || exit 0
          docker tag ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:rollback
          docker push ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:rollback

      # Tag :latest n'est PAS mis à jour pour les releases saas-v* :
      # un tag SemVer release peut pointer sur n'importe quel commit
      # (rollback inclus) et ne doit pas écraser le :latest qui sert
      # le staging auto-deploy.
      - name: Compute image tags
        id: image_tags
        run: |
          BASE="${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}"
          if [[ "${{ steps.meta.outputs.is_saas_release }}" == "true" ]]; then
            echo "tags<<EOF" >> $GITHUB_OUTPUT
            echo "${BASE}:${{ steps.meta.outputs.tag }}" >> $GITHUB_OUTPUT
            echo "EOF" >> $GITHUB_OUTPUT
          else
            echo "tags<<EOF" >> $GITHUB_OUTPUT
            echo "${BASE}:${{ steps.meta.outputs.tag }}" >> $GITHUB_OUTPUT
            echo "${BASE}:latest" >> $GITHUB_OUTPUT
            echo "EOF" >> $GITHUB_OUTPUT
          fi

      - name: Build & push image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          platforms: linux/amd64
          tags: ${{ steps.image_tags.outputs.tags }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          build-args: |
            VERSION=${{ steps.meta.outputs.tag }}

      # === Veridian patch === Scan CVE OS + libs systeme + libs upstream
      # bake dans l'image via Trivy. Constitution §13 étage 2.
      #
      # Strategie BLOQUANTE/WARN identique a npm audit console :
      # - CRITICAL → bloque (immediatement actionnable, on ne deploit pas)
      # - HIGH → WARNING uniquement (dette upstream alpine/Go).
      # - `ignore-unfixed: true` : pas actionnable.
      # - `--exit-on-eol 1` : fail si OS distrib en EOL (alpine < 3.18).
      # - SARIF upload → GitHub Security tab pour drill-down.
      # - SBOM CycloneDX artifact → traçabilité supply-chain.
      - name: Trivy scan image — CRITICAL bloquant + SARIF
        uses: aquasecurity/trivy-action@0.33.0
        with:
          image-ref: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ steps.meta.outputs.tag }}
          severity: 'CRITICAL,HIGH'
          format: 'sarif'
          output: 'trivy-image.sarif'
          ignore-unfixed: 'true'
          exit-code: '0'  # SARIF non bloquant, fail séparé sur CRITICAL

      - name: Upload Trivy image SARIF
        uses: github/codeql-action/upload-sarif@v3
        if: always()
        with:
          sarif_file: 'trivy-image.sarif'
          category: 'trivy-image'

      - name: Trivy fail on CRITICAL + EOL
        uses: aquasecurity/trivy-action@0.33.0
        with:
          image-ref: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ steps.meta.outputs.tag }}
          severity: 'CRITICAL'
          format: 'table'
          ignore-unfixed: 'true'
          exit-code: '1'
        env:
          TRIVY_EXIT_ON_EOL: '1'

      - name: Trivy HIGH report (warning only)
        uses: aquasecurity/trivy-action@0.33.0
        with:
          image-ref: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ steps.meta.outputs.tag }}
          severity: 'HIGH'
          format: 'table'
          ignore-unfixed: 'true'
          exit-code: '0'

      - name: Generate CycloneDX SBOM
        uses: aquasecurity/trivy-action@0.33.0
        with:
          image-ref: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ steps.meta.outputs.tag }}
          scan-type: 'image'
          format: 'cyclonedx'
          output: 'sbom-cyclonedx.json'

      - name: Upload SBOM artifact
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: sbom-cyclonedx-${{ steps.meta.outputs.tag }}
          path: 'sbom-cyclonedx.json'
          retention-days: 90

  deploy-staging:
    name: Deploy staging (compose pur sur dev-pub via Traefik staging-edge)
    needs: build
    # Staging deploy auto sur push veridian uniquement.
    # Tags saas-v* sont des releases prod : pas d'auto-deploy.
    if: github.ref == 'refs/heads/veridian'
    runs-on: [self-hosted, linux, x64]
    environment:
      name: staging
      url: https://notifuse.staging.veridian.site
    env:
      STAGING_DIR: /opt/veridian/staging/notifuse
      COMPOSE_FILE: infra/compose/staging.yml
      PROJECT_NAME: notifuse-staging
      SVC_APP: notifuse-staging
    steps:
      - uses: actions/checkout@v4

      - name: Sync compose vers ${STAGING_DIR}/infra/compose
        run: |
          # Le dossier ${STAGING_DIR} est ubuntu:ubuntu (chown one-shot fait
          # lors de la création du .env). Le runner peut écrire sans sudo.
          mkdir -p ${STAGING_DIR}/infra/compose
          cp infra/compose/staging.yml ${STAGING_DIR}/infra/compose/
          if [ ! -f ${STAGING_DIR}/.env ]; then
            echo "❌ ${STAGING_DIR}/.env manquant — créer à la main avec les secrets staging"
            exit 1
          fi

      - name: Pull image GHCR + up -d via compose pur
        working-directory: ${{ env.STAGING_DIR }}
        run: |
          docker compose -f ${COMPOSE_FILE} -p ${PROJECT_NAME} --env-file .env pull ${SVC_APP} 2>&1 | tail -5
          docker compose -f ${COMPOSE_FILE} -p ${PROJECT_NAME} --env-file .env up -d 2>&1 | tail -10
          # Force recreate notifuse au cas où :latest pointe sur même image (rebuild)
          docker compose -f ${COMPOSE_FILE} -p ${PROJECT_NAME} --env-file .env up -d --force-recreate --no-deps ${SVC_APP} 2>&1 | tail -5

      - name: Wait for staging healthy
        run: |
          # Healthcheck en 2 étapes pour garantir qu'app+routes Veridian sont
          # toutes mountées avant les e2e :
          #   1. /api/setup.status — l'app HTTP répond
          #   2. /api/transactional.send (POST avec body bidon) — la route
          #      upstream est enregistrée dans le mux. On accepte 401/400/402 ;
          #      on refuse 404 (route absente = container pas prêt).
          #
          # Sans cette double-check, on a observé des flakies (run 25574039155)
          # où /api/transactional.send retournait `404 page not found` quelques
          # secondes après que setup.status soit healthy : le container avait
          # démarré le HTTP listener mais pas encore fini d'enregistrer toutes
          # les routes upstream. Les e2e démarraient et tombaient sur des 404.
          for i in {1..30}; do
            if curl -sf https://notifuse.staging.veridian.site/api/setup.status > /dev/null 2>&1; then
              CODE=$(curl -s -o /dev/null -w "%{http_code}" -X POST \
                -H "Content-Type: application/json" \
                -H "Authorization: Bearer health-check-fake-key" \
                -d '{}' \
                https://notifuse.staging.veridian.site/api/transactional.send)
              if [ "$CODE" != "404" ]; then
                echo "Staging healthy after ${i} attempts (transactional.send → ${CODE})"
                exit 0
              fi
              echo "  attempt ${i}: setup.status OK but transactional.send → 404 (routes pas encore mountées)"
            fi
            sleep 10
          done
          echo "Staging unhealthy after 5min"
          exit 1

      - name: Cleanup test tenants via admin API (proper, no SQL bricolage)
        if: github.event.inputs.skip_wipe != 'true'
        env:
          HUB_SECRET: ${{ secrets.NOTIFUSE_HUB_API_SECRET_STAGING }}
        run: |
          # Wipe via /api/veridian/admin/wipe-test-tenants (HMAC signed) :
          # appelle WorkspaceService.DeleteWorkspace upstream (DROP DATABASE
          # propre + workspace row) + planRepo.HardDelete sur la veridian_plan.
          # Skip les tenants matchant safety_client_prefixes (clients reels).
          # On wipe par chaque prefix de test connu (3+ chars min, pas de wildcard).
          for prefix in chaos magic stat paywall pwsus pwdel pwpath pwread autotest idem bump dbg smoke fresh statsus statdel up down unkplan resume sus mag genmag magtam magicre delconf e2e replaytest tampertest wrongsecret huge nofix wscre wscre2 uiguard direct paywsmoke; do
            BODY="{\"prefix\":\"${prefix}\"}"
            TS=$(date +%s%3N)
            SIG=$(echo -n "${TS}.${BODY}" | openssl dgst -sha256 -hmac "${HUB_SECRET}" -hex | awk '{print $2}')
            RESP=$(curl -sS -X POST "https://notifuse.staging.veridian.site/api/veridian/admin/wipe-test-tenants" \
              -H "Content-Type: application/json" \
              -H "X-Veridian-Hub-Signature: ${SIG}" \
              -H "X-Veridian-Timestamp: ${TS}" \
              -d "${BODY}")
            WIPED=$(echo "$RESP" | jq -r '.wiped | length' 2>/dev/null || echo "0")
            ERRORS=$(echo "$RESP" | jq -r '.errors | length' 2>/dev/null || echo "0")
            if [ "$WIPED" != "0" ] || [ "$ERRORS" != "0" ]; then
              echo "  prefix=${prefix} wiped=${WIPED} errors=${ERRORS}"
            fi
          done
          # Verifier que staging repond toujours (les wipes ne doivent pas casser l'app)
          curl -sf https://notifuse.staging.veridian.site/api/setup.status > /dev/null && echo "Staging still healthy after cleanup" || (echo "Staging UNHEALTHY after cleanup" && exit 1)

      - name: Cleanup runner (always — Constitution §20)
        if: always()
        run: |
          docker container prune -f
          docker image prune -f --filter "until=1h"
          docker volume prune -f --filter "label!=keep=true"
          docker buildx prune -f --keep-storage 10GB --filter "until=168h" || true
          sudo rm -rf /tmp/runner-${{ github.run_id }}-* || true
          df -h / | awk 'NR==2 {if ($5+0 > 80) print "⚠ Disk:", $5, "used"}'

  e2e-staging:
    name: E2E headful Playwright (staging, BLOQUANT)
    needs: deploy-staging
    if: github.event.inputs.skip_e2e != 'true'
    runs-on: [self-hosted, linux, x64]
    env:
      NOTIFUSE_URL: https://notifuse.staging.veridian.site
      HUB_URL: https://saas-hub.staging.veridian.site
      HUB_API_SECRET: ${{ secrets.NOTIFUSE_HUB_API_SECRET_STAGING }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install Playwright
        run: |
          cd tests/e2e-veridian
          npm ci
          npx playwright install chromium --with-deps
      - name: Run e2e
        run: |
          cd tests/e2e-veridian
          # Pas de --reporter=line ici : on utilise la config (line + html + json
          # en CI) pour qu'on ait artefacts utiles meme sur succes (analyse perfs)
          # et un rapport HTML drill-down sur fail.
          npx playwright test --project=chromium
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: playwright-report
          path: |
            tests/e2e-veridian/playwright-report/
            tests/e2e-veridian/playwright-results.json
            tests/e2e-veridian/test-results/
          retention-days: 14

  deploy-prod:
    name: Deploy prod (manual only — green/blue review required)
    needs: e2e-staging
    # === Veridian patch === Deploy prod desactive sur push automatique.
    # La prod Notifuse est sensible (clients reels), on ne pousse JAMAIS
    # automatiquement. Pour deployer en prod : utiliser workflow_dispatch
    # avec l'input deploy_prod=true OU faire le green/blue manuel via
    # Dokploy UI apres validation Robert.
    if: github.event_name == 'workflow_dispatch' && github.event.inputs.deploy_prod == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Trigger Dokploy redeploy (prod)
        run: |
          curl -X POST \
            -H "x-api-key: ${{ secrets.DOKPLOY_API_TOKEN }}" \
            -H "Content-Type: application/json" \
            "${{ secrets.DOKPLOY_URL }}/api/compose.redeploy" \
            -d '{"composeId":"${{ secrets.DOKPLOY_NOTIFUSE_PROD_COMPOSE_ID }}"}'

      - name: Wait for prod healthy
        run: |
          for i in {1..30}; do
            if curl -sf https://notifuse.app.veridian.site/api/health > /dev/null 2>&1; then
              echo "Prod healthy"
              exit 0
            fi
            sleep 10
          done
          echo "Prod unhealthy after 5min — triggering rollback"
          exit 1

  e2e-prod:
    name: E2E headful Playwright (prod, BLOQUANT)
    needs: deploy-prod
    runs-on: [self-hosted, linux, x64]
    env:
      NOTIFUSE_URL: https://notifuse.app.veridian.site
      HUB_URL: https://app.veridian.site
      HUB_API_SECRET: ${{ secrets.NOTIFUSE_HUB_API_SECRET_PROD }}
      E2E_PROD_MODE: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: |
          cd tests/e2e-veridian
          npm ci
          npx playwright install chromium --with-deps
          # Pas de --reporter=line ici : on utilise la config (line + html + json).
          npx playwright test --project=chromium --grep "@prod-safe"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: playwright-report-prod
          path: |
            tests/e2e-veridian/playwright-report/
            tests/e2e-veridian/playwright-results.json
            tests/e2e-veridian/test-results/
          retention-days: 14

  rollback:
    name: Rollback prod si e2e-prod fail
    needs: [e2e-prod, deploy-prod, build]
    if: failure() && needs.deploy-prod.result == 'success'
    runs-on: ubuntu-latest
    steps:
      - name: Tag broken + restore rollback
        run: |
          BROKEN_TAG="${{ needs.build.outputs.image_tag }}"
          docker pull ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${BROKEN_TAG}
          docker tag ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${BROKEN_TAG} ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:broken-${GITHUB_SHA::8}
          docker push ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:broken-${GITHUB_SHA::8}

          docker pull ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:rollback
          docker tag ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:rollback ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest
          docker push ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest

      - name: Redeploy prod with rollback image
        run: |
          curl -X POST \
            -H "x-api-key: ${{ secrets.DOKPLOY_API_TOKEN }}" \
            -H "Content-Type: application/json" \
            "${{ secrets.DOKPLOY_URL }}/api/compose.redeploy" \
            -d '{"composeId":"${{ secrets.DOKPLOY_NOTIFUSE_PROD_COMPOSE_ID }}"}'

      - name: Notify Telegram
        run: |
          curl -X POST \
            "https://api.telegram.org/bot${{ secrets.TELEGRAM_BOT_TOKEN }}/sendMessage" \
            -d "chat_id=${{ secrets.TELEGRAM_CHAT_ID }}" \
            --data-urlencode "text=🚨 Notifuse Veridian PROD rollback — e2e-prod a fail sur ${GITHUB_SHA::8}, image precedente restauree."

  promote-prod-compose:
    # Push compose prod (infra/compose/prod.yml) vers notifuse-deploy.
    # Webhook GitHub → Dokploy → pull + recreate. Opt-in workflow_dispatch.
    # Pré-requis : secret NOTIFUSE_DEPLOY_PUSH_PAT (PAT scope repo sur notifuse-deploy).
    name: Promote compose prod vers notifuse-deploy (manuel uniquement)
    if: github.event_name == 'workflow_dispatch' && github.event.inputs.promote_prod_compose == 'true'
    runs-on: ubuntu-latest
    environment:
      name: production
      url: https://github.com/Christ-Roy/notifuse-deploy
    steps:
      - uses: actions/checkout@v4

      - name: Valider compose prod
        run: |
          chmod +x scripts/ci/generate-compose.sh
          scripts/ci/generate-compose.sh prod

      - name: Push compose vers notifuse-deploy
        env:
          GH_TOKEN: ${{ secrets.NOTIFUSE_DEPLOY_PUSH_PAT }}
        run: |
          if [ -z "$GH_TOKEN" ]; then
            echo "❌ Secret NOTIFUSE_DEPLOY_PUSH_PAT manquant"
            exit 1
          fi
          TMPDIR=$(mktemp -d)
          git clone "https://x-access-token:${GH_TOKEN}@github.com/Christ-Roy/notifuse-deploy.git" "$TMPDIR"
          cd "$TMPDIR"

          # En-tête de traçabilité + contenu copié depuis notre prod.yml
          cat > docker-compose.yml <<HEADER
          # ╔══════════════════════════════════════════════════════════════════╗
          # ║ FICHIER GÉNÉRÉ — NE PAS ÉDITER À LA MAIN                        ║
          # ║                                                                  ║
          # ║ Source : Christ-Roy/notifuse-veridian/infra/compose/prod.yml    ║
          # ║ SHA   : ${GITHUB_SHA::12}                                       ║
          # ║ Run   : ${GITHUB_RUN_ID}                                        ║
          # ╚══════════════════════════════════════════════════════════════════╝
          HEADER
          cat ${GITHUB_WORKSPACE}/infra/compose/prod.yml >> docker-compose.yml

          echo "─── diff vs HEAD précédent ───"
          git diff docker-compose.yml | head -80 || true

          if git diff --quiet docker-compose.yml; then
            echo "✅ Aucun changement à pousser — compose déjà à jour."
            exit 0
          fi

          git config user.email "ci-bot@veridian.site"
          git config user.name "Veridian CI Bot"
          git add docker-compose.yml
          COMMIT_MSG=$(cat <<MSG
          chore: sync compose depuis notifuse-veridian @ ${GITHUB_SHA::8}

          Source SHA: ${GITHUB_SHA}
          Run: ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}
          MSG
          )
          git commit -m "$COMMIT_MSG"
          git push origin main
          echo "✅ Compose poussé vers notifuse-deploy. Dokploy va redéployer."

      - name: Wait for prod healthy after Dokploy redeploy
        run: |
          sleep 30
          for i in {1..30}; do
            if curl -sf https://notifuse.app.veridian.site/api/setup.status > /dev/null 2>&1; then
              echo "Prod healthy après ${i} tentatives"
              exit 0
            fi
            sleep 10
          done
          echo "❌ Prod unhealthy 5min après promotion compose"
          exit 1
