/api/veridian/policy.get:
  get:
    summary: Send policy by recipient provider class, explained (Veridian L3)
    description: |
      Veridian extension. Returns, for each recipient provider class, the rules the worker
      applies to a workspace: daily cap, rate per minute, share of the domain warm-up cap,
      slowdown threshold of the reputation fuse, and the observed reply value. Each value
      carries its origin (`preset` = catalogue default, `workspace_override` = set with
      `policy.set`) and a plain-French explanation. `shadowed_by` lists sending profiles
      that set their own value and therefore mask the policy for their own sends.

      Auth = JWT or workspace API key. Requires `workspace:read`.
    operationId: veridianPolicyGet
    security:
      - BearerAuth: []
    parameters:
      - name: workspace_id
        in: query
        required: true
        schema: { type: string }
      - name: class
        in: query
        description: Restrict to one class (google, ovh, orange...).
        schema: { type: string }
    responses:
      '200':
        description: Effective policy
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/VeridianPolicyView'
      '400':
        $ref: '#/components/responses/BadRequest'
      '401':
        $ref: '#/components/responses/Unauthorized'
      '403':
        $ref: '#/components/responses/Forbidden'
  post:
    summary: Send policy by recipient provider class (POST form)
    operationId: veridianPolicyGetPost
    security:
      - BearerAuth: []
    requestBody:
      required: true
      content:
        application/json:
          schema:
            type: object
            required: [workspace_id]
            properties:
              workspace_id: { type: string }
              class: { type: string }
    responses:
      '200':
        description: Effective policy
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/VeridianPolicyView'
      '401':
        $ref: '#/components/responses/Unauthorized'

/api/veridian/policy.set:
  post:
    summary: Override send-policy rules of one provider class for a workspace
    description: |
      Sets the given values and keeps the others. Values left out (or 0) are not touched.
      Bounds: `daily_cap` 1 to 1000, `rate_per_min` 0.01 to 10, `warmup_share` 0.01 to 1,
      `slowdown_threshold` 0.01 to 0.15. A value set by hand on a sending profile still wins
      for that profile (the response warns). The worker sees the change within seconds.

      Requires `workspace:write`.
    operationId: veridianPolicySet
    security:
      - BearerAuth: []
    requestBody:
      required: true
      content:
        application/json:
          schema:
            type: object
            required: [workspace_id, class]
            properties:
              workspace_id: { type: string }
              class: { type: string, example: ovh }
              daily_cap: { type: integer, minimum: 1, maximum: 1000 }
              rate_per_min: { type: number, minimum: 0.01, maximum: 10 }
              warmup_share: { type: number, minimum: 0.01, maximum: 1 }
              slowdown_threshold: { type: number, minimum: 0.01, maximum: 0.15 }
              reason: { type: string, maxLength: 300 }
    responses:
      '200':
        description: The class after the change, and warnings
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/VeridianPolicySetResult'
      '400':
        $ref: '#/components/responses/BadRequest'
      '401':
        $ref: '#/components/responses/Unauthorized'
      '403':
        $ref: '#/components/responses/Forbidden'

/api/veridian/policy.reset:
  post:
    summary: Remove overrides of one provider class (back to the catalogue defaults)
    description: Requires `workspace:write`. `rules` names the rules to reset (all when omitted).
    operationId: veridianPolicyReset
    security:
      - BearerAuth: []
    requestBody:
      required: true
      content:
        application/json:
          schema:
            type: object
            required: [workspace_id, class]
            properties:
              workspace_id: { type: string }
              class: { type: string }
              rules:
                type: array
                items:
                  type: string
                  enum: [daily_cap, rate_per_min, warmup_share, slowdown_threshold]
    responses:
      '200':
        description: The class after the reset
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/VeridianPolicySetResult'
      '400':
        $ref: '#/components/responses/BadRequest'
      '401':
        $ref: '#/components/responses/Unauthorized'
      '403':
        $ref: '#/components/responses/Forbidden'

/api/veridian/policy.priority.list:
  get:
    summary: Send priority of every broadcast and automation
    description: |
      Priority is 2 to 9 (default 5; 1 is reserved for sequence transactional mail). A smaller
      number is dequeued first. It only changes the order when the queue is congested between
      campaigns: when the per-sender or per-provider cap is the limit, it does not send more.

      Requires `broadcasts:read` and `automations:read`.
    operationId: veridianPolicyPriorityList
    security:
      - BearerAuth: []
    parameters:
      - name: workspace_id
        in: query
        required: true
        schema: { type: string }
    responses:
      '200':
        description: Priorities
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/VeridianPriorityList'
      '401':
        $ref: '#/components/responses/Unauthorized'
      '403':
        $ref: '#/components/responses/Forbidden'
  post:
    summary: Send priority list (POST form)
    operationId: veridianPolicyPriorityListPost
    security:
      - BearerAuth: []
    requestBody:
      required: true
      content:
        application/json:
          schema:
            type: object
            required: [workspace_id]
            properties:
              workspace_id: { type: string }
    responses:
      '200':
        description: Priorities
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/VeridianPriorityList'

/api/veridian/policy.priority.set:
  post:
    summary: Set the send priority of a broadcast or automation
    description: |
      Rewrites the priority of its mails already waiting in the queue (pending or paused);
      mails already sent do not move, priority-1 transactional mails are never touched.
      Requires `broadcasts:write` (broadcast) or `automations:write` (automation).
    operationId: veridianPolicyPrioritySet
    security:
      - BearerAuth: []
    requestBody:
      required: true
      content:
        application/json:
          schema:
            type: object
            required: [workspace_id, source_type, source_id, priority]
            properties:
              workspace_id: { type: string }
              source_type: { type: string, enum: [broadcast, automation] }
              source_id: { type: string }
              priority: { type: integer, minimum: 2, maximum: 9 }
    responses:
      '200':
        description: The new priority and the number of waiting mails rewritten
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/VeridianPriorityChange'
      '400':
        $ref: '#/components/responses/BadRequest'
      '401':
        $ref: '#/components/responses/Unauthorized'
      '403':
        $ref: '#/components/responses/Forbidden'
      '404':
        description: Unknown broadcast or automation

/api/veridian/policy.priority.clear:
  post:
    summary: Remove the send priority of a broadcast or automation (back to 5)
    operationId: veridianPolicyPriorityClear
    security:
      - BearerAuth: []
    requestBody:
      required: true
      content:
        application/json:
          schema:
            type: object
            required: [workspace_id, source_type, source_id]
            properties:
              workspace_id: { type: string }
              source_type: { type: string, enum: [broadcast, automation] }
              source_id: { type: string }
    responses:
      '200':
        description: Priority back to the default
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/VeridianPriorityChange'
      '404':
        description: Unknown broadcast or automation

/api/veridian/stock.overview:
  get:
    summary: Stock by recipient provider class, days of coverage, restock need (Veridian L3)
    description: |
      Veridian extension. Per recipient provider class: contacts of the enrolled list and of the reserve
      list (the columns of the `stock-par-classe.py` script: `enrolled`, `reserve`, `prospectable`,
      `capacity_today`, `days_of_coverage` = prospectable / capacity of the day, same rounding and order),
      plus what the script cannot tell: contacts never mailed (`unsent`), coverage on a full sending day
      (`days_unsent`), a `status`, and `restock_need` = contacts to source to hold `target_days` days.

      `capacity_today` sums the configured capacity of the active commercial profiles (it shrinks during
      the day and is 0 outside the sending window); `capacity_nominal` is a full sending day.
      Lists, filters and class column come from `stock.config`, any of them can be overridden in the
      request (read only: nothing is written).

      Requires `contacts:read` and `message_history:read`.
    operationId: veridianStockOverview
    security:
      - BearerAuth: []
    parameters:
      - { name: workspace_id, in: query, required: true, schema: { type: string } }
      - { name: days, in: query, description: Target coverage in sending days (1 to 60), schema: { type: integer } }
      - { name: enrolled_list, in: query, schema: { type: string } }
      - { name: reserve_list, in: query, schema: { type: string } }
      - { name: exclude_email_regex, in: query, schema: { type: string } }
      - { name: class_field, in: query, description: custom_string_1 to custom_string_5 (default custom_string_5), schema: { type: string } }
      - { name: require_non_empty, in: query, description: Comma separated columns that must be filled, schema: { type: string } }
      - { name: exclude_prefix, in: query, description: Comma separated column:prefix pairs that exclude a contact, schema: { type: string } }
    responses:
      '200':
        description: Stock table
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/VeridianStockOverview'
      '400':
        $ref: '#/components/responses/BadRequest'
      '401':
        $ref: '#/components/responses/Unauthorized'
      '403':
        $ref: '#/components/responses/Forbidden'
  post:
    summary: Stock by recipient provider class (POST form, same fields in the JSON body)
    operationId: veridianStockOverviewPost
    security:
      - BearerAuth: []
    requestBody:
      required: true
      content:
        application/json:
          schema:
            type: object
            required: [workspace_id]
            properties:
              workspace_id: { type: string }
              days: { type: integer }
              enrolled_list: { type: string }
              reserve_list: { type: string }
    responses:
      '200':
        description: Stock table
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/VeridianStockOverview'

/api/veridian/stock.config:
  get:
    summary: Definition of the stock (lists, filters, target coverage)
    description: Requires `workspace:read`. Without a saved definition the lists of the active automations are used.
    operationId: veridianStockConfig
    security:
      - BearerAuth: []
    parameters:
      - { name: workspace_id, in: query, required: true, schema: { type: string } }
    responses:
      '200':
        description: Effective definition
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/VeridianStockConfigView'
      '401':
        $ref: '#/components/responses/Unauthorized'
      '403':
        $ref: '#/components/responses/Forbidden'

/api/veridian/stock.config.set:
  post:
    summary: Save the definition of the stock (replaces the previous one)
    description: Requires `workspace:write`. Columns are restricted to custom_string_1 to custom_string_5; unknown fields are refused.
    operationId: veridianStockConfigSet
    security:
      - BearerAuth: []
    requestBody:
      required: true
      content:
        application/json:
          schema:
            allOf:
              - type: object
                required: [workspace_id]
                properties:
                  workspace_id: { type: string }
              - $ref: '#/components/schemas/VeridianStockConfig'
    responses:
      '200':
        description: Saved definition
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/VeridianStockConfigView'
      '400':
        $ref: '#/components/responses/BadRequest'
      '403':
        $ref: '#/components/responses/Forbidden'

/api/veridian/policy.suggest-enrollment:
  get:
    summary: How many reserve contacts to enroll per class to hold N days of coverage (enrols nobody)
    description: |
      Veridian extension. For each class: capacity per sending day (class cap after slowdown, bounded by the
      whole-day capacity of the profiles) x `days`, minus the follow-ups of contacts already in sequence that
      fall due in the horizon, minus the enrolled contacts never mailed = the gap. `suggest_enroll` =
      min(gap, eligible reserve); `shortfall` = what the reserve cannot cover (to source, see
      `restock_priority`). Eligible reserve: never mailed, not unsubscribed or bounced, not already enrolled.

      **Nothing is ever enrolled** (`applied` is always false): the caller enrolls the returned addresses
      (`include_emails=true`, ordered by priority `custom_string_2` then score `custom_number_1`) with
      `automations.enroll`, or not.

      Requires `contacts:read` and `message_history:read`.
    operationId: veridianPolicySuggestEnrollment
    security:
      - BearerAuth: []
    parameters:
      - { name: workspace_id, in: query, required: true, schema: { type: string } }
      - { name: days, in: query, schema: { type: integer, minimum: 1, maximum: 60 } }
      - { name: include_emails, in: query, schema: { type: boolean } }
      - { name: limit, in: query, description: Addresses at most per class (default 200, max 2000), schema: { type: integer } }
      - { name: enrolled_list, in: query, schema: { type: string } }
      - { name: reserve_list, in: query, schema: { type: string } }
      - { name: enroll_automation, in: query, schema: { type: string } }
    responses:
      '200':
        description: Suggestion
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/VeridianSuggestion'
      '400':
        $ref: '#/components/responses/BadRequest'
      '401':
        $ref: '#/components/responses/Unauthorized'
      '403':
        $ref: '#/components/responses/Forbidden'
  post:
    summary: Enrollment suggestion (POST form, same fields in the JSON body)
    operationId: veridianPolicySuggestEnrollmentPost
    security:
      - BearerAuth: []
    requestBody:
      required: true
      content:
        application/json:
          schema:
            type: object
            required: [workspace_id]
            properties:
              workspace_id: { type: string }
              days: { type: integer }
              include_emails: { type: boolean }
              limit: { type: integer }
    responses:
      '200':
        description: Suggestion
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/VeridianSuggestion'

components:
  schemas:
    VeridianPolicyValue:
      type: object
      properties:
        value: {}
        source: { type: string, enum: [preset, workspace_override] }
        preset: {}
        shadowed_by:
          type: array
          items: { type: string }
    VeridianPolicyClass:
      type: object
      properties:
        class: { type: string }
        label: { type: string }
        daily_cap: { $ref: '#/components/schemas/VeridianPolicyValue' }
        rate_per_min: { $ref: '#/components/schemas/VeridianPolicyValue' }
        warmup_share: { $ref: '#/components/schemas/VeridianPolicyValue' }
        slowdown_threshold: { $ref: '#/components/schemas/VeridianPolicyValue' }
        observed:
          type: object
          properties:
            sent: { type: integer }
            bounced: { type: integer }
            replied_human: { type: integer }
            basis: { type: string, enum: [workspace, catalog] }
            reply_rate: { type: number, nullable: true }
            reply_rate_smoothed: { type: number }
            bounce_rate: { type: number, nullable: true }
        why: { type: string }
        rules:
          type: array
          items:
            type: object
            properties:
              name: { type: string }
              value: {}
              source: { type: string }
              text: { type: string }
        explanation: { type: string }
    VeridianPolicyView:
      type: object
      properties:
        workspace_id: { type: string }
        catalog_as_of: { type: string }
        catalog_source: { type: string }
        overrides: { type: integer }
        classes:
          type: array
          items: { $ref: '#/components/schemas/VeridianPolicyClass' }
    VeridianPolicySetResult:
      type: object
      properties:
        class: { $ref: '#/components/schemas/VeridianPolicyClass' }
        warnings:
          type: array
          items: { type: string }
    VeridianPriorityList:
      type: object
      properties:
        workspace_id: { type: string }
        default_priority: { type: integer }
        min_priority: { type: integer }
        max_priority: { type: integer }
        note: { type: string }
        sources:
          type: array
          items:
            type: object
            properties:
              source_type: { type: string }
              source_id: { type: string }
              name: { type: string }
              status: { type: string }
              priority: { type: integer }
              explicit: { type: boolean }
              pending: { type: integer }
    VeridianPriorityChange:
      type: object
      properties:
        source_type: { type: string }
        source_id: { type: string }
        priority: { type: integer }
        requeued_pending: { type: integer, format: int64 }
        note: { type: string }
    VeridianStockConfig:
      type: object
      properties:
        enrolled_list_id: { type: string }
        reserve_list_id: { type: string }
        enroll_automation_id: { type: string }
        class_field: { type: string, example: custom_string_5 }
        exclude_email_regex: { type: string }
        require_non_empty: { type: array, items: { type: string } }
        exclude_prefixes: { type: object, additionalProperties: { type: array, items: { type: string } } }
        target_days: { type: integer, minimum: 1, maximum: 60 }
    VeridianStockConfigView:
      type: object
      properties:
        workspace_id: { type: string }
        source: { type: string, enum: [none, config] }
        config: { $ref: '#/components/schemas/VeridianStockConfig' }
    VeridianStockRow:
      type: object
      properties:
        class: { type: string }
        label: { type: string }
        enrolled: { type: integer }
        reserve: { type: integer }
        prospectable: { type: integer }
        capacity_today: { type: integer }
        days_of_coverage: { type: number, nullable: true }
        enrolled_unsent: { type: integer }
        reserve_unsent: { type: integer }
        unsent: { type: integer }
        capacity_nominal: { type: integer }
        days_unsent: { type: number, nullable: true }
        status: { type: string, enum: [ok, bas, critique, sans_plafond, inactive] }
        restock_need: { type: integer }
        reply_rate_smoothed: { type: number }
    VeridianStockOverview:
      type: object
      properties:
        workspace_id: { type: string }
        generated_at: { type: string, format: date-time }
        target_days: { type: integer }
        config: { $ref: '#/components/schemas/VeridianStockConfig' }
        config_source: { type: string, enum: [request, config, automations, none] }
        classes:
          type: array
          items: { $ref: '#/components/schemas/VeridianStockRow' }
        totals: { type: object }
        notes: { type: array, items: { type: string } }
    VeridianSuggestRow:
      type: object
      properties:
        class: { type: string }
        label: { type: string }
        capacity_per_day: { type: integer }
        horizon_capacity: { type: integer }
        followups_due: { type: integer }
        room_for_new: { type: integer }
        enrolled_unsent: { type: integer }
        gap: { type: integer }
        reserve_unsent: { type: integer }
        suggest_enroll: { type: integer }
        shortfall: { type: integer }
        reply_rate_smoothed: { type: number }
        emails: { type: array, items: { type: string } }
    VeridianSuggestion:
      type: object
      properties:
        workspace_id: { type: string }
        generated_at: { type: string, format: date-time }
        days: { type: integer }
        enroll_automation_id: { type: string }
        applied: { type: boolean, description: Always false, nothing is enrolled by this route. }
        classes:
          type: array
          items: { $ref: '#/components/schemas/VeridianSuggestRow' }
        totals: { type: object }
        restock_priority:
          type: array
          items:
            type: object
            properties:
              class: { type: string }
              label: { type: string }
              shortfall: { type: integer }
              reply_rate_smoothed: { type: number }
        notes: { type: array, items: { type: string } }
