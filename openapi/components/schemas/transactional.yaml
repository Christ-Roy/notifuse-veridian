SendTransactionalRequest:
  type: object
  required:
    - workspace_id
    - notification
  properties:
    workspace_id:
      type: string
      description: The ID of the workspace
      example: ws_1234567890
    notification:
      $ref: '#/TransactionalNotificationSendParams'

TransactionalNotificationSendParams:
  type: object
  required:
    - id
    - contact
    - channels
  properties:
    id:
      type: string
      description: ID of the notification to send
      example: welcome_email
    external_id:
      type: string
      nullable: true
      description: External ID for idempotency checks
      example: txn_12345
    contact:
      $ref: 'contact.yaml#/Contact'
    channels:
      type: array
      description: Channels to send through (at least one required)
      minItems: 1
      items:
        type: string
        enum:
          - email
      example:
        - email
    data:
      type: object
      additionalProperties: true
      description: Data to populate the template with
      example:
        user_name: John Doe
        activation_link: https://example.com/activate/abc123
    metadata:
      type: object
      additionalProperties: true
      description: Additional metadata for tracking
      example:
        campaign_id: spring_promo_2023
        source: user_signup
    email_options:
      type: object
      description: Email-specific options
      properties:
        from_name:
          type: string
          nullable: true
          description: Override default sender from name
          example: Support Team
        subject:
          type: string
          nullable: true
          description: Override template subject line. Supports Liquid templating variables.
          maxLength: 255
          example: "Welcome, {{ name }}!"
        subject_preview:
          type: string
          nullable: true
          description: Override template preheader/preview text. Supports Liquid templating variables.
          maxLength: 255
          example: "Your order has been confirmed"
        cc:
          type: array
          description: CC email addresses
          items:
            type: string
            format: email
          example:
            - manager@example.com
        bcc:
          type: array
          description: BCC email addresses
          items:
            type: string
            format: email
          example:
            - archive@example.com
        reply_to:
          type: string
          format: email
          description: Reply-To email address
          example: support@example.com
        attachments:
          type: array
          description: Email attachments (max 20 files, 3MB per file, 10MB total)
          items:
            $ref: '#/EmailAttachment'
          maxItems: 20
          example:
            - filename: invoice.pdf
              content: JVBERi0xLjQKJeLjz9MKMy4uLg==
              content_type: application/pdf
              disposition: attachment

EmailAttachment:
  type: object
  required:
    - filename
    - content
  properties:
    filename:
      type: string
      description: Name of the file (max 255 characters, no path separators)
      example: invoice.pdf
      maxLength: 255
    content:
      type: string
      format: byte
      description: Base64-encoded file content (max 3MB per file)
      example: JVBERi0xLjQKJeLjz9MKMy4uLg==
    content_type:
      type: string
      description: MIME type of the file (auto-detected if not provided)
      example: application/pdf
    disposition:
      type: string
      enum:
        - attachment
        - inline
      description: How the attachment should be displayed (defaults to 'attachment')
      example: attachment
      default: attachment

ChannelTemplate:
  type: object
  description: Template configuration for a single channel.
  required:
    - template_id
  properties:
    template_id:
      type: string
      description: ID of the template to render for this channel.
      example: tpl_welcome
    settings:
      type: object
      additionalProperties: true
      description: Optional channel-specific settings.

ChannelTemplates:
  type: object
  description: |
    Maps a channel name to its template configuration. The only supported
    channel today is `email`. At least one channel is required.
  minProperties: 1
  additionalProperties:
    $ref: '#/ChannelTemplate'
  example:
    email:
      template_id: tpl_welcome

TransactionalNotification:
  type: object
  description: A transactional notification configuration (template binding + tracking).
  properties:
    id:
      type: string
      description: Unique identifier, also used as the trigger ID in transactional.send.
      example: welcome_email
    name:
      type: string
      example: Welcome email
    description:
      type: string
      example: Sent right after signup.
    channels:
      $ref: '#/ChannelTemplates'
    tracking_settings:
      $ref: 'template.yaml#/TrackingSettings'
    metadata:
      type: object
      additionalProperties: true
      description: Arbitrary metadata stored with the notification.
    integration_id:
      type: string
      nullable: true
      description: Set if the notification is managed by an integration (e.g. Supabase).
    created_at:
      type: string
      format: date-time
    updated_at:
      type: string
      format: date-time
    deleted_at:
      type: string
      format: date-time
      nullable: true

TransactionalNotificationCreateParams:
  type: object
  description: Parameters to create a transactional notification.
  required:
    - id
    - name
    - channels
  properties:
    id:
      type: string
      description: Unique identifier for API triggering (used as the `id` in transactional.send).
      example: welcome_email
    name:
      type: string
      example: Welcome email
    description:
      type: string
      example: Sent right after signup.
    channels:
      $ref: '#/ChannelTemplates'
    tracking_settings:
      $ref: 'template.yaml#/TrackingSettings'
    metadata:
      type: object
      additionalProperties: true

TransactionalNotificationUpdateParams:
  type: object
  description: |
    Fields to update on an existing transactional notification. All fields are
    optional but at least one of `name`, `description`, `channels` or `metadata`
    must be provided.
  properties:
    name:
      type: string
      example: Welcome email (v2)
    description:
      type: string
    channels:
      $ref: '#/ChannelTemplates'
    tracking_settings:
      $ref: 'template.yaml#/TrackingSettings'
    metadata:
      type: object
      additionalProperties: true

CreateTransactionalRequest:
  type: object
  required:
    - workspace_id
    - notification
  properties:
    workspace_id:
      type: string
      description: The ID of the workspace.
      example: ws_demo
    notification:
      $ref: '#/TransactionalNotificationCreateParams'

UpdateTransactionalRequest:
  type: object
  required:
    - workspace_id
    - id
    - updates
  properties:
    workspace_id:
      type: string
      description: The ID of the workspace.
      example: ws_demo
    id:
      type: string
      description: ID of the notification to update.
      example: welcome_email
    updates:
      $ref: '#/TransactionalNotificationUpdateParams'

DeleteTransactionalRequest:
  type: object
  required:
    - workspace_id
    - id
  properties:
    workspace_id:
      type: string
      description: The ID of the workspace.
      example: ws_demo
    id:
      type: string
      description: ID of the notification to soft-delete.
      example: welcome_email
