Automation:
  type: object
  description: |
    An automation is a visual workflow (sequence of nodes) that contacts travel
    through when a trigger event fires. Nodes are embedded in the automation as a
    flat list; `root_node_id` points to the entry node. The graph is followed via
    each node's `next_node_id` (or branch/filter targets in the node config).
  required:
    - id
    - name
    - status
    - trigger
  properties:
    id:
      type: string
      maxLength: 36
      description: Unique automation ID (UUID recommended). Required, max 36 chars.
      example: 7c3e2b1a-1234-4abc-9def-0123456789ab
    workspace_id:
      type: string
      description: Workspace this automation belongs to.
      example: ws_demo
    name:
      type: string
      maxLength: 255
      description: Human-readable name.
      example: Cold outreach 3-step sequence
    status:
      type: string
      enum: [draft, live, paused]
      description: |
        Lifecycle status. `draft` (default on create), `live` (trigger installed,
        enrolling contacts), `paused` (trigger dropped, contacts frozen). Use the
        activate/pause endpoints to transition — do not flip this field manually.
      example: draft
    list_id:
      type: string
      description: |
        Optional list used for unsubscribe links in email nodes. NOT an enrollment
        filter. Required when the automation contains email nodes.
      example: list_main
    trigger:
      $ref: '#/TimelineTriggerConfig'
    root_node_id:
      type: string
      description: ID of the entry node. Required when `nodes` is non-empty.
      example: node_start
    nodes:
      type: array
      description: Embedded workflow nodes (the steps of the sequence).
      items:
        $ref: '#/AutomationNode'
    stats:
      $ref: '#/AutomationStats'
    created_at:
      type: string
      format: date-time
      readOnly: true
    updated_at:
      type: string
      format: date-time
      readOnly: true

TimelineTriggerConfig:
  type: object
  description: Defines which timeline event enrolls a contact into the automation.
  required:
    - event_kind
    - frequency
  properties:
    event_kind:
      type: string
      description: Timeline event that triggers enrollment.
      enum:
        - contact.created
        - contact.updated
        - contact.deleted
        - list.subscribed
        - list.unsubscribed
        - list.confirmed
        - list.resubscribed
        - list.bounced
        - list.complained
        - list.pending
        - list.removed
        - segment.joined
        - segment.left
        - email.sent
        - email.delivered
        - email.opened
        - email.clicked
        - email.bounced
        - email.complained
        - email.unsubscribed
        - custom_event
      example: contact.created
    frequency:
      type: string
      enum: [once, every_time]
      description: |
        `once` = enroll a contact only on the first occurrence (deduped via
        automation_trigger_log). `every_time` = re-enroll on each occurrence.
      example: once
    list_id:
      type: string
      nullable: true
      description: Required for `list.*` events (filters on the list).
    segment_id:
      type: string
      nullable: true
      description: Required for `segment.*` events.
    custom_event_name:
      type: string
      nullable: true
      description: Required for `custom_event` (matches `custom_event.{name}`).
    updated_fields:
      type: array
      items:
        type: string
      description: For `contact.updated` — only trigger when one of these fields changed.
    conditions:
      type: object
      nullable: true
      additionalProperties: true
      description: Optional TreeNode condition tree (same DSL as segments).

AutomationNode:
  type: object
  description: |
    A single step in the workflow. `config` is a polymorphic object whose shape
    depends on `type` (see the per-type config schemas below).
  required:
    - id
    - type
    - config
  properties:
    id:
      type: string
      example: node_email_1
    automation_id:
      type: string
    type:
      type: string
      enum:
        - trigger
        - delay
        - email
        - branch
        - filter
        - add_to_list
        - remove_from_list
        - ab_test
        - webhook
        - list_status_branch
      description: |
        Node type. `config` shape per type:
        delay → DelayNodeConfig; email → EmailNodeConfig; branch → BranchNodeConfig;
        filter → FilterNodeConfig; add_to_list → AddToListNodeConfig;
        remove_from_list → RemoveFromListNodeConfig; ab_test → ABTestNodeConfig;
        webhook → WebhookNodeConfig; list_status_branch → ListStatusBranchNodeConfig.
      example: email
    config:
      type: object
      additionalProperties: true
      description: Type-specific configuration. See *NodeConfig schemas.
    next_node_id:
      type: string
      nullable: true
      description: Next node in linear flow (branch/filter use their own targets).
    position:
      type: object
      description: Canvas coordinates (UI only).
      properties:
        x:
          type: number
        y:
          type: number

DelayNodeConfig:
  type: object
  description: Wait before continuing.
  required: [duration, unit]
  properties:
    duration:
      type: integer
      minimum: 1
      example: 2
    unit:
      type: string
      enum: [minutes, hours, days]
      example: days

EmailNodeConfig:
  type: object
  description: Send an email using a template.
  required: [template_id]
  properties:
    template_id:
      type: string
      example: tpl_welcome
    integration_id:
      type: string
      nullable: true
      description: Sending integration (EmailProvider) override.
    subject_override:
      type: string
      nullable: true
    from_override:
      type: string
      nullable: true

BranchNodeConfig:
  type: object
  description: Route the contact down one of several condition paths.
  properties:
    paths:
      type: array
      items:
        type: object
        properties:
          id: { type: string }
          name: { type: string }
          conditions:
            type: object
            nullable: true
            additionalProperties: true
          next_node_id: { type: string }
    default_path_id:
      type: string

FilterNodeConfig:
  type: object
  description: Continue or exit based on a condition.
  properties:
    description: { type: string }
    conditions:
      type: object
      nullable: true
      additionalProperties: true
    continue_node_id: { type: string }
    exit_node_id: { type: string }

AddToListNodeConfig:
  type: object
  required: [list_id, status]
  properties:
    list_id: { type: string }
    status:
      type: string
      enum: [active, pending]
    metadata:
      type: object
      additionalProperties: true

RemoveFromListNodeConfig:
  type: object
  required: [list_id]
  properties:
    list_id: { type: string }

ListStatusBranchNodeConfig:
  type: object
  required: [list_id]
  properties:
    list_id: { type: string }
    not_in_list_node_id: { type: string }
    active_node_id: { type: string }
    non_active_node_id: { type: string }

ABTestNodeConfig:
  type: object
  description: Split contacts across weighted variants (weights must sum to 100).
  required: [variants]
  properties:
    variants:
      type: array
      minItems: 2
      items:
        type: object
        required: [id, name, weight, next_node_id]
        properties:
          id: { type: string, example: A }
          name: { type: string, example: Control }
          weight: { type: integer, minimum: 1, maximum: 100, example: 50 }
          next_node_id: { type: string }

WebhookNodeConfig:
  type: object
  required: [url]
  properties:
    url:
      type: string
      description: HTTP(S) URL to POST to.
      example: https://hooks.example.com/automation
    secret:
      type: string
      nullable: true
      description: "Optional — sent as an `Authorization: Bearer <secret>` header."

AutomationStats:
  type: object
  readOnly: true
  properties:
    enrolled: { type: integer }
    completed: { type: integer }
    exited: { type: integer }
    failed: { type: integer }

ContactAutomation:
  type: object
  description: Tracks one contact's journey through one automation.
  properties:
    id: { type: string }
    automation_id: { type: string }
    contact_email: { type: string, format: email }
    current_node_id:
      type: string
      nullable: true
    status:
      type: string
      enum: [active, completed, exited, failed]
    exit_reason:
      type: string
      nullable: true
    entered_at:
      type: string
      format: date-time
    scheduled_at:
      type: string
      format: date-time
      nullable: true

NodeExecution:
  type: object
  description: One log entry of a contact passing through a node.
  properties:
    id: { type: string }
    contact_automation_id: { type: string }
    automation_id: { type: string }
    node_id: { type: string }
    node_type: { type: string }
    action:
      type: string
      enum: [entered, processing, completed, failed, skipped]
    entered_at:
      type: string
      format: date-time
    completed_at:
      type: string
      format: date-time
      nullable: true
    duration_ms:
      type: integer
      nullable: true
    output:
      type: object
      additionalProperties: true
    error:
      type: string
      nullable: true

CreateAutomationRequest:
  type: object
  required: [workspace_id, automation]
  properties:
    workspace_id:
      type: string
      example: ws_demo
    automation:
      $ref: '#/Automation'

UpdateAutomationRequest:
  type: object
  required: [workspace_id, automation]
  properties:
    workspace_id:
      type: string
    automation:
      $ref: '#/Automation'

AutomationIDRequest:
  type: object
  description: Shared body for activate / pause / delete.
  required: [workspace_id, automation_id]
  properties:
    workspace_id:
      type: string
      example: ws_demo
    automation_id:
      type: string
      example: 7c3e2b1a-1234-4abc-9def-0123456789ab

EnrollContactsRequest:
  type: object
  description: |
    Veridian extension. Enroll one or more contacts into a LIVE automation at its
    root node, programmatically (without firing the trigger event). Idempotent:
    a contact already `active` in the automation is skipped.
  required: [workspace_id, automation_id, contact_emails]
  properties:
    workspace_id:
      type: string
      example: ws_demo
    automation_id:
      type: string
      example: 7c3e2b1a-1234-4abc-9def-0123456789ab
    contact_emails:
      type: array
      minItems: 1
      maxItems: 1000
      description: Bare email addresses (no display name). Deduplicated and lowercased.
      items:
        type: string
        format: email
      example:
        - alice@example.com
        - bob@acme.io

EnrollContactsResponse:
  type: object
  properties:
    enrolled:
      type: integer
      description: Newly enrolled contacts.
      example: 1
    skipped:
      type: integer
      description: Contacts already active (idempotent no-op).
      example: 1
    failed:
      type: integer
      description: Contacts that errored.
      example: 0
    results:
      type: array
      items:
        type: object
        properties:
          email:
            type: string
            format: email
          status:
            type: string
            enum: [enrolled, already_active, error]
          error:
            type: string
      example:
        - email: alice@example.com
          status: enrolled
        - email: bob@acme.io
          status: already_active
