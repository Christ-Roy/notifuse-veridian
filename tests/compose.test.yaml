services:
  postgres-test:
    image: postgres:17
    command:
      - 'postgres'
      - '-c'
      - 'max_connections=300'
      - '-c'
      - 'shared_buffers=128MB'
    environment:
      POSTGRES_DB: postgres
      POSTGRES_USER: notifuse_test
      POSTGRES_PASSWORD: test_password
    ports:
      # === Veridian patch === Override le port via NOTIFUSE_DB_TEST_PORT
      # (défaut 5433). Permet de coexister avec d'autres Postgres locaux
      # (ex: verger-postgres déjà sur 5433 chez certains devs).
      - '${NOTIFUSE_DB_TEST_PORT:-5433}:5432'
    volumes:
      - postgres_test_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U notifuse_test -d postgres']
      interval: 10s
      timeout: 5s
      retries: 5

  mailpit:
    image: axllent/mailpit:latest
    environment:
      MP_MAX_MESSAGES: 2000
    ports:
      # === Veridian patch === Ports override via NOTIFUSE_SMTP_TEST_PORT
      # et NOTIFUSE_MAILPIT_UI_PORT pour coexister avec d'autres SMTP locaux
      # (ex: verger-mailhog déjà sur 1025).
      - '${NOTIFUSE_SMTP_TEST_PORT:-1025}:1025' # SMTP server
      - '${NOTIFUSE_MAILPIT_UI_PORT:-8025}:8025' # Web UI
    healthcheck:
      test: ['CMD', 'wget', '--quiet', '--tries=1', '--spider', 'http://localhost:8025/']
      interval: 10s
      timeout: 5s
      retries: 3

volumes:
  postgres_test_data:
    driver: local
